/* Analytics — a single stateless GA4 page_view beacon (§11: pageview-only). No
   gtag.js (keeps zero-CDN), no cookie, no persisted client id — the cid is
   ephemeral, generated per load, so there is no cross-visit tracking. It never
   sends image data, filenames, or PII, and fires once, only on the deployed
   https origin (so local/dev/gate runs stay silent and CSP-clean). */
const GA_ID = "G-W7DM58QMS3";
function gaPageview() {
  try {
    if (location.protocol !== "https:") return;
    if (/^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname)) return;
    const rnd = () => Math.floor(Math.random() * 1e10);
    const p = new URLSearchParams({
      v: "2", tid: GA_ID, cid: rnd() + "." + rnd(),   // ephemeral client id, never stored
      en: "page_view",
      dl: location.origin + location.pathname,          // path only — no query/hash, no filenames
      dt: "Muse",                                       // fixed title, never the image name
      ul: (navigator.language || "en").toLowerCase(),
      sr: (screen.width || 0) + "x" + (screen.height || 0),
      _s: "1", sid: String(Date.now()), sct: "1", seg: "1",
    });
    const url = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (navigator.sendBeacon) navigator.sendBeacon(url);
    else fetch(url, { method: "POST", mode: "no-cors", keepalive: true }).catch(() => {});
  } catch (_) {}
}

/* ---- Boot ---- */
function boot() {
  // static strings
  $("ver").textContent = t("version");

  const gl = getGL();
  if (!gl) { showFatal(); return; }

  let engine;
  try {
    engine = makeEngine(gl);
  } catch (e) {
    console.error("[muse] engine init failed:", e);
    showFatal();
    return;
  }

  let variant = 0;
  let sourceImage = null;   // loaded user image (ImageBitmap/canvas); null → procedural sample
  let sourceDirty = true;   // GPU source needs (re)upload before next render
  let hasContent = false;   // something has been rendered → hero dismissed, editor live
  const thumbCanvas = document.createElement("canvas");  // offscreen: thumbs never touch #view
  let thumbGen = 0;         // generation guard so a user action aborts an in-flight thumb pass

  // Full-chain count: active GL passes + the trim compositor when enabled.
  const chainCount = () => engine.activeCount() + (RECIPE.params.trim.bypass ? 0 : 1);
  const currentSource = () => sourceImage || makeSampleImage(1024, 768, variant);
  // sourceDirty splits upload from re-render: param-only edits (sliders, looks)
  // skip the re-upload, so dragging a slider on a big photo stays smooth.
  function draw() {
    if (sourceDirty) { engine.render(currentSource()); sourceDirty = false; }
    else { engine.render(); }
    compositeTrim(canvas, view);
    $("engine-status").textContent = t("engineReady", chainCount());
  }

  /* ---- In-app toasts (never native alert/confirm — handoff §12) ---- */
  const toastHost = $("toasts");
  function toast(msg, kind) {
    const el = document.createElement("div");
    el.className = "toast" + (kind === "err" ? " err" : "");
    el.textContent = msg;
    toastHost.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .3s"; el.style.opacity = "0";
      setTimeout(() => el.remove(), 320);
    }, kind === "err" ? 5200 : 4200);
  }

  /* ---- Source loading: hero → live editor ---- */
  const hero = $("hero");
  function revealEditor() {
    hasContent = true;
    hero.classList.add("hidden");
    $("export").hidden = false;
    $("export-jpeg").hidden = false;
    $("match-open").hidden = false;
    $("save-preset").hidden = false;
    $("adjust").hidden = false;
  }
  function setSource(img) { sourceImage = img; sourceDirty = true; revealEditor(); draw(); refreshThumbs(); }
  function loadSample() { sourceImage = null; sourceDirty = true; revealEditor(); draw(); refreshThumbs(); }
  // Responsive-from-arrival (UX-H2): if a look is chosen before any image is loaded,
  // start on the first CC0 sample (already decoded in the hero) rather than doing
  // nothing. Falls back to the procedural sample if the gallery isn't ready.
  function loadDefaultSample() {
    const img = document.querySelector("#hero-samples .sample img");
    if (img && img.complete && img.naturalWidth) setSource(img);
    else loadSample();
  }

  const MAX_MP = 24;   // >24MP → downscale for preview (handoff §4)
  async function loadFile(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) { toast(t("toastUnreadable"), "err"); return; }
    // Sniff an embedded Muse recipe (PNG tEXt / JPEG COM) before we throw the bytes away.
    let recipeStr = null;
    if (/png/i.test(file.type)) {
      try { recipeStr = readRecipePNG(new Uint8Array(await file.arrayBuffer())); } catch (_) {}
    } else if (/jpeg/i.test(file.type)) {
      try { recipeStr = readRecipeJPEG(new Uint8Array(await file.arrayBuffer())); } catch (_) {}
    }
    let bmp;
    try {
      bmp = await createImageBitmap(file, { imageOrientation: "from-image" });  // respect EXIF rotation
    } catch (e) {
      console.error("[muse] decode failed:", e); toast(t("toastDecodeFail"), "err"); return;
    }
    let img = bmp;
    const mp = (bmp.width * bmp.height) / 1e6;
    if (mp > MAX_MP) {
      const s = Math.sqrt(MAX_MP / mp);
      const cw = Math.max(1, Math.round(bmp.width * s)), ch = Math.max(1, Math.round(bmp.height * s));
      const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
      cv.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
      img = cv;
      toast(t("toastDownscaled", mp.toFixed(0)));
    }
    setSource(img);
    if (recipeStr) promptRestore(recipeStr);   // in-app confirm, never native (§4)
  }

  // Recipe carried in a dropped image → offer to restore the exact edit (§4).
  async function promptRestore(recipeStr) {
    const yes = await openModal({
      title: t("recipeFoundTitle"),
      body: t("recipeFoundBody"),
      actions: [
        { label: t("restore"), value: true, primary: true },
        { label: t("keepAsIs"), value: false },
      ],
      dismissValue: false,
    });
    if (yes) { try { setRecipe(JSON.parse(recipeStr)); } catch (e) { console.error("[muse] recipe restore failed:", e); } }
  }

  // Export the composited frame with its recipe embedded (§6). FSA primary,
  // <a download> fallback. via omitted here (a UI export, not an agent one).
  async function exportImage(format) {
    if (!hasContent) return;
    const fmt = format === "jpeg" ? "jpeg" : "png";
    const mime = fmt === "jpeg" ? "image/jpeg" : "image/png";
    try {
      const blob = await new Promise((res) => view.toBlob(res, mime, fmt === "jpeg" ? 0.92 : undefined));
      if (!blob) throw new Error("toBlob returned null");
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const withRecipe = fmt === "jpeg"
        ? embedRecipeJPEG(bytes, serialiseRecipe(RECIPE))
        : embedRecipePNG(bytes, serialiseRecipe(RECIPE));
      const ext = fmt === "jpeg" ? "jpg" : "png";
      const result = await saveBlob(new Blob([withRecipe], { type: mime }), `muse-${RECIPE.look}.${ext}`);
      if (result === "cancelled") toast(t("exportCancelled"));
      else toast(t("exportDone"));
    } catch (e) {
      console.error("[muse] export failed:", e); toast(t("exportFail"), "err");
    }
  }
  $("export").addEventListener("click", () => exportImage("png"));
  $("export-jpeg").addEventListener("click", () => exportImage("jpeg"));

  // File picker + drag/drop. Window-level dragover/drop preventDefault stops the
  // browser from navigating away when a photo lands outside the stage.
  const fileInput = $("file-input");
  fileInput.addEventListener("change", () => {

  $("hero-open").addEventListener("click", pick);

  // Bundled CC0 sample gallery (§ try-before-upload). Each thumbnail is a loaded
  // <img> from an embedded data-URI; clicking loads it into the editor at full
  // (embedded) resolution — no re-decode, no network, same-origin so export works.
  function buildSampleGallery() {
    const host = $("hero-samples");
    host.textContent = "";
    for (const s of SAMPLES) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sample"; b.setAttribute("role", "listitem");
      b.setAttribute("aria-label", s.name);

      host.appendChild(b);
    }
    $("hero-samples").hidden = SAMPLES.length === 0;
    $("sample-label").hidden = SAMPLES.length === 0;
    $("sample-credit").hidden = SAMPLES.length === 0;
  }

  const stage = document.querySelector(".stage");
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  stage.addEventListener("dragenter", (e) => { stop(e); hero.classList.add("drag"); });
  stage.addEventListener("dragover", (e) => { stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; hero.classList.add("drag"); });
  stage.addEventListener("dragleave", (e) => { stop(e); if (e.target === stage || e.target === hero) hero.classList.remove("drag"); });
  stage.addEventListener("drop", (e) => { stop(e); hero.classList.remove("drag"); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadFile(f); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  // Look strip — one pill per look, then custom presets (B5). Active state:
  // a preset if the current recipe matches one exactly, else the base look.
  const strip = $("lookstrip");
  let presets = (() => {
    try { const a = JSON.parse(store.get(STORE_KEYS.presets) || "[]"); return Array.isArray(a) ? a : []; }
    catch (_) { return []; }
  })();
  const savePresets = () => store.set(STORE_KEYS.presets, JSON.stringify(presets));

  function buildLookStrip() {
    strip.textContent = "";
    const names = t("lookNames");
    const byId = Object.fromEntries(LOOKS.map((l) => [l.id, l]));
    const mkPill = (lk) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "look"; b.dataset.look = lk.id;
      const img = document.createElement("img"); img.className = "thumb"; img.alt = "";
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = names[lk.id] || lk.name;
      b.append(img, nm);
      // Era decade label (a prop, locale-independent like the date stamp — §13).
      if (lk.era) { const e = document.createElement("span"); e.className = "era"; e.textContent = lk.era; b.appendChild(e); }
      b.addEventListener("click", () => setLook(lk.id));
      return b;
    };
    // "Start here" cluster first (brand looks), then a divider, then the rest in era order.
    for (const id of FEATURED) { if (byId[id]) strip.appendChild(mkPill(byId[id])); }
    const div = document.createElement("span"); div.className = "deck-div"; div.setAttribute("aria-hidden", "true"); strip.appendChild(div);
    for (const lk of LOOKS) { if (!FEATURED.includes(lk.id)) strip.appendChild(mkPill(lk)); }
    presets.forEach((pr, i) => {
      const wrap = document.createElement("span"); wrap.className = "preset-wrap";
      const b = document.createElement("button");
      b.type = "button"; b.className = "look"; b.dataset.preset = String(i);
      b.textContent = pr.name || t("unnamed");
      b.addEventListener("click", () => setRecipe(pr.recipe));
      const del = document.createElement("button");
      del.type = "button"; del.className = "look-del"; del.textContent = "✕";
      del.setAttribute("aria-label", t("deletePreset", pr.name || t("unnamed")));
      del.addEventListener("click", (e) => { e.stopPropagation(); presets.splice(i, 1); savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs(); toast(t("presetDeleted")); });
      wrap.append(b, del); strip.appendChild(wrap);
    });
  }
  function syncLookStrip() {
    const cur = serialiseRecipe(RECIPE);
    const activePreset = presets.findIndex((pr) => serialiseRecipe(deserialiseRecipe(pr.recipe)) === cur);
    for (const b of strip.querySelectorAll(".look")) {
      if (b.dataset.preset != null) b.setAttribute("aria-pressed", String(+b.dataset.preset === activePreset));
      else b.setAttribute("aria-pressed", String(activePreset < 0 && b.dataset.look === RECIPE.look));
    }
  }

  /* ---- Presets: save (localStorage) + .muse.json import/export (own transport) ---- */
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const presetFileInput = document.createElement("input");
  presetFileInput.type = "file"; presetFileInput.accept = ".muse.json,.json,application/json";
  presetFileInput.className = "visually-hidden";
  presetFileInput.setAttribute("aria-label", "Import .muse.json preset");   // a11y
  document.body.appendChild(presetFileInput);
  presetFileInput.addEventListener("change", async () => {
    const f = presetFileInput.files && presetFileInput.files[0]; presetFileInput.value = "";
    if (!f) return;
    try { setRecipe(deserialiseRecipe(JSON.parse(await f.text()))); toast(t("jsonImported")); }
    catch (e) { console.error("[muse] json import failed:", e); toast(t("jsonInvalid"), "err"); }
  });
  async function doSavePreset() {
    const node = document.createElement("div");
    const input = document.createElement("input");
    input.className = "field"; input.type = "text"; input.placeholder = t("presetNamePlaceholder"); input.maxLength = 40;
    node.appendChild(input);
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:8px;margin-top:12px;flex-wrap:wrap";
    const exp = document.createElement("button"); exp.type = "button"; exp.className = "btn"; exp.textContent = t("exportJson");
    exp.addEventListener("click", () => downloadBlob(new Blob([serialiseRecipe(RECIPE)], { type: "application/json" }), `muse-${RECIPE.look}.muse.json`));
    const imp = document.createElement("button"); imp.type = "button"; imp.className = "btn"; imp.textContent = t("importJson");
    imp.addEventListener("click", () => presetFileInput.click());
    row.append(exp, imp); node.appendChild(row);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const ok = node.closest(".modal").querySelector(".btn.primary"); ok && ok.click(); } });
    setTimeout(() => input.focus(), 0);
    const ok = await openModal({ title: t("savePresetTitle"), node, actions: [{ label: t("save"), value: true, primary: true }, { label: t("cancel"), value: false }], dismissValue: false });
    if (ok) {
      const name = (input.value || "").trim() || t("unnamed");
      presets.push({ name, recipe: getRecipe() });
      savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs();
      toast(t("presetSaved", name));
    }
  }
  $("save-preset").addEventListener("click", doSavePreset);

  /* ---- Look-deck thumbnails (B2): each base-look pill previews that look on the
     loaded image. Rendered small off the current state, then restored. Refreshed
     only on a source change (not on every look switch — the source is what varies). ---- */
  // Render each look's preview to the OFFSCREEN thumbCanvas (never #view → no flicker),
  // one per animation frame so the first look paints instantly and the deck fills without
  // freezing (G-M3). A generation guard aborts the pass if the user acts mid-flight, so the
  // shared RECIPE is never left on a thumb's look.
  function refreshThumbs() {
    if (!hasContent) return;
    const gen = ++thumbGen;
    const prev = RECIPE;
    const src = currentSource();
    const tw = 152, th = Math.max(1, Math.round(tw * (src.height / src.width))) || 114;
    const small = document.createElement("canvas"); small.width = tw; small.height = th;
    small.getContext("2d").drawImage(src, 0, 0, tw, th);
    const pills = [...strip.querySelectorAll(".look[data-look]")];
    let i = 0;
    const step = () => {
      if (gen !== thumbGen) return;                 // superseded (user acted / newer pass) — stop, don't restore
      if (i >= pills.length) { RECIPE = prev; sourceDirty = true; draw(); return; }  // done → restore live view
      const b = pills[i++];
      try {
        RECIPE = makeRecipe(b.dataset.look);
        engine.render(small); compositeTrim(canvas, thumbCanvas);   // offscreen
        const img = b.querySelector("img.thumb");
        if (img) { img.src = thumbCanvas.toDataURL("image/jpeg", 0.72); b.classList.add("has-thumb"); }
      } catch (_) {}
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---- Slider panel (B3): fieldset per pass, per-pass bypass, tokenised ranges.
     panelSync[] holds one updater per control so a look/recipe change reflects
     into every input in O(controls). ---- */
  const drawer = $("drawer"), drawerBody = $("drawer-body"), seedInput = $("seed-input");
  const passNames = t("passNames"), ctlNames = t("ctl"), rgbSub = t("rgbSub");
  const panelSync = [];
  const fmtVal = (v, step) => Number(v).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3);
  // Resolve a control prop to [container, key]; a dotted prop ("tone.amt") steps into a
  // nested param object so the duotone Tone controls reuse the same range/rgb machinery.
  const resolveP = (pass, prop) => {
    if (prop.indexOf(".") < 0) return [RECIPE.params[pass], prop];
    const [a, b] = prop.split("."); return [RECIPE.params[pass][a], b];
  };
  const getP = (pass, prop, idx) => { const [c, k] = resolveP(pass, prop); const v = c[k]; return idx == null ? v : v[idx]; };
  const setP = (pass, prop, idx, val) => { const [c, k] = resolveP(pass, prop); if (idx == null) c[k] = val; else c[k][idx] = val; };

  function buildPanel() {
    drawerBody.textContent = ""; panelSync.length = 0;

    // --- Basics tier: five plain-language macros over the deep passes (M2). ---
    const basics = document.createElement("section"); basics.className = "basics";
    const bT = document.createElement("h3"); bT.className = "basics-title"; bT.textContent = t("basicsTitle");
    basics.appendChild(bT);
    const basicNames = t("basics");
    for (const b of BASICS) {
      const wrap = document.createElement("div"); wrap.className = "ctl";
      const lab = document.createElement("div"); lab.className = "lab";
      const t1 = document.createElement("span"); t1.textContent = basicNames[b.key] || b.key;
      const val = document.createElement("span"); val.className = "val";
      lab.append(t1, val); wrap.appendChild(lab);
      const r = document.createElement("input"); r.type = "range"; r.min = b.min; r.max = b.max; r.step = b.step;
      r.setAttribute("aria-label", basicNames[b.key] || b.key);
      if (b.center) r.classList.add("center");
      r.addEventListener("input", () => {
        RECIPE.params[b.pass][b.prop] = parseFloat(r.value);
        if (b.unbypass) RECIPE.params[b.pass].bypass = false;
        syncPanel();                 // mirror into the Advanced sliders + bypass toggles
        if (hasContent) draw();
      });
      wrap.appendChild(r);
      panelSync.push(() => { const v = RECIPE.params[b.pass][b.prop]; r.value = v; val.textContent = fmtVal(v, b.step); });
      basics.appendChild(wrap);
    }
    drawerBody.appendChild(basics);

    // --- Advanced: the full per-pass panel, collapsed by default (progressive disclosure). ---
    const adv = document.createElement("details"); adv.className = "advanced";
    const sum = document.createElement("summary"); sum.textContent = t("advancedTitle"); adv.appendChild(sum);
    for (const grp of PANEL) {
      const fs = document.createElement("fieldset");
      fs.className = "pass"; fs.dataset.pass = grp.pass;
      const lg = document.createElement("legend");
      const nm = document.createElement("span"); nm.textContent = passNames[grp.pass] || grp.pass; lg.appendChild(nm);
      const sw = document.createElement("label"); sw.className = "sw";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "toggle";
      cb.setAttribute("aria-label", (passNames[grp.pass] || grp.pass) + " " + t("bypassOn"));
      const swt = document.createElement("span"); swt.textContent = t("bypassOn");
      sw.appendChild(cb); sw.appendChild(swt); lg.appendChild(sw); fs.appendChild(lg);
      cb.addEventListener("change", () => { RECIPE.params[grp.pass].bypass = !cb.checked; fs.dataset.bypassed = cb.checked ? "0" : "1"; if (hasContent) draw(); });
      panelSync.push(() => { const on = !RECIPE.params[grp.pass].bypass; cb.checked = on; fs.dataset.bypassed = on ? "0" : "1"; });

      for (const c of grp.controls) {
        const wrap = document.createElement("div"); wrap.className = "ctl";
        if (c.rgb) {
          wrap.classList.add("rgb");
          const lab = document.createElement("div"); lab.className = "lab";
          const t1 = document.createElement("span"); t1.textContent = ctlNames[c.key] || c.key;
          const val = document.createElement("span"); val.className = "val";
          lab.append(t1, val); wrap.appendChild(lab);
          const triple = document.createElement("div"); triple.className = "triple";
          const ins = [];
          for (let i = 0; i < 3; i++) {
            const col = document.createElement("div");
            const r = document.createElement("input"); r.type = "range"; r.min = c.min; r.max = c.max; r.step = c.step;
            r.setAttribute("aria-label", (ctlNames[c.key] || c.key) + " " + rgbSub[i]);
            const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = rgbSub[i];
            col.append(r, sub); triple.appendChild(col); ins.push(r);
            r.addEventListener("input", () => { setP(grp.pass, c.prop, i, parseFloat(r.value)); val.textContent = ins.map((x) => fmtVal(x.value, c.step)).join(" "); if (hasContent) draw(); });
          }
          wrap.appendChild(triple);
          panelSync.push(() => { for (let i = 0; i < 3; i++) ins[i].value = getP(grp.pass, c.prop, i); val.textContent = ins.map((x) => fmtVal(x.value, c.step)).join(" "); });
        } else if (c.kind === "select") {
          const lab = document.createElement("label"); lab.className = "lab"; lab.textContent = ctlNames[c.key] || c.key; wrap.appendChild(lab);
          const sel = document.createElement("select"); sel.className = "field";
          sel.setAttribute("aria-label", ctlNames[c.key] || c.key);   // programmatic label (a11y)
          for (const opt of c.options) { const o = document.createElement("option"); o.value = opt; o.textContent = opt === "none" ? ctlNames.none : opt; sel.appendChild(o); }
          sel.addEventListener("change", () => { RECIPE.params[grp.pass][c.prop] = sel.value; if (hasContent) draw(); });
          wrap.appendChild(sel);
          panelSync.push(() => { sel.value = RECIPE.params[grp.pass][c.prop]; });
        } else if (c.kind === "toggle") {
          const lab = document.createElement("label"); lab.style.cssText = "display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer";
          const cbx = document.createElement("input"); cbx.type = "checkbox"; cbx.className = "toggle";
          const span = document.createElement("span"); span.textContent = ctlNames[c.key] || c.key;
          lab.append(cbx, span); wrap.appendChild(lab);
          cbx.addEventListener("change", () => { RECIPE.params[grp.pass][c.prop] = cbx.checked; if (hasContent) draw(); });
          panelSync.push(() => { cbx.checked = !!RECIPE.params[grp.pass][c.prop]; });
        } else {
          const lab = document.createElement("div"); lab.className = "lab";
          const t1 = document.createElement("span"); t1.textContent = ctlNames[c.key] || c.key;
          const val = document.createElement("span"); val.className = "val";
          lab.append(t1, val); wrap.appendChild(lab);
          const r = document.createElement("input"); r.type = "range"; r.min = c.min; r.max = c.max; r.step = c.step;
          r.setAttribute("aria-label", ctlNames[c.key] || c.key);
          r.addEventListener("input", () => { setP(grp.pass, c.prop, null, parseFloat(r.value)); val.textContent = fmtVal(r.value, c.step); if (hasContent) draw(); });
          wrap.appendChild(r);
          panelSync.push(() => { r.value = getP(grp.pass, c.prop, null); val.textContent = fmtVal(r.value, c.step); });
        }
        fs.appendChild(wrap);
      }
      adv.appendChild(fs);
    }
    drawerBody.appendChild(adv);
  }
  function syncPanel() { for (const f of panelSync) f(); seedInput.value = RECIPE.seed; }

  // Seed: numeric field + deterministic shuffle (LCG step, no Math.random).
  seedInput.addEventListener("change", () => { RECIPE.seed = Math.max(0, Math.floor(Number(seedInput.value) || 0)) >>> 0; seedInput.value = RECIPE.seed; if (hasContent) draw(); });
  $("seed-shuffle").addEventListener("click", () => { RECIPE.seed = (RECIPE.seed * 1664525 + 1013904223) >>> 0; seedInput.value = RECIPE.seed; if (hasContent) draw(); });

  // Drawer open/close with focus trap + Esc (a11y — B9) + a tap-to-dismiss scrim
  // and swipe-down-to-close on the mobile sheet (G-M2).
  const adjustBtn = $("adjust");
  let drawerOpen = false, drawerKey = null, drawerScrim = null;
  function openDrawer() {
    if (drawerOpen) return;
    drawerScrim = document.createElement("div"); drawerScrim.className = "drawer-scrim";
    drawerScrim.addEventListener("pointerdown", closeDrawer);
    document.body.appendChild(drawerScrim);
    drawer.hidden = false;
    requestAnimationFrame(() => { drawer.classList.add("open"); drawerScrim.classList.add("open"); });
    drawerOpen = true; adjustBtn.setAttribute("aria-expanded", "true");
    drawerKey = (e) => { if (e.key === "Escape") { e.preventDefault(); closeDrawer(); } else if (e.key === "Tab") trapTab(e, drawer); };
    document.addEventListener("keydown", drawerKey, true);
    const first = drawer.querySelector("button, input, select"); first && first.focus();
  }
  function closeDrawer() {
    if (!drawerOpen) return;
    drawer.classList.remove("open"); drawerOpen = false; adjustBtn.setAttribute("aria-expanded", "false");
    document.removeEventListener("keydown", drawerKey, true);
    if (drawerScrim) { const s = drawerScrim; drawerScrim = null; s.classList.remove("open"); setTimeout(() => s.remove(), 220); }
    setTimeout(() => { if (!drawerOpen) drawer.hidden = true; }, 220);
    adjustBtn.focus();
  }
  adjustBtn.addEventListener("click", () => (drawerOpen ? closeDrawer() : openDrawer()));
  $("drawer-close").addEventListener("click", closeDrawer);
  // Swipe down on the sheet header closes it (mobile).
  {
    const head = drawer.querySelector(".drawer-head");
    let sy = null;
    head.addEventListener("pointerdown", (e) => { if (e.target.closest("input,button")) return; sy = e.clientY; });
    head.addEventListener("pointerup", (e) => { if (sy != null && e.clientY - sy > 40) closeDrawer(); sy = null; });
  }

  // State mutations funnel through these so strip, panel, and canvas stay in sync —
  // the same one mechanism the agent face (§8) drives. Param-only changes don't
  // re-upload the source (sourceDirty stays false). Draw is deferred until there's
  // content, so choosing a look before loading an image doesn't paint behind the hero.
  function setLook(id) { thumbGen++; RECIPE = makeRecipe(id); syncLookStrip(); syncPanel(); if (hasContent) draw(); else loadDefaultSample(); }
  function setRecipe(obj) { thumbGen++; RECIPE = deserialiseRecipe(obj); syncLookStrip(); syncPanel(); if (hasContent) draw(); }
  function getRecipe() { return JSON.parse(serialiseRecipe(RECIPE)); }

  /* ---- M2: Camera (selfie). The live feed is pulled from a hidden <video> and rendered
     THROUGH the WebGL2 chain to #cam-view, so the look is applied while you frame the shot.
     getUserMedia only (a MediaStream — no network, no CSP surface); tracks are .stop()ed on
     every close, capture, flip, and tab-hide, so the camera light never leaks. The one
     indirection `gum()` is the single point the m2 self-test monkeypatches (a canvas
     captureStream fake camera) so the whole path is headless-verifiable. ---- */
  const camVideo = $("cam-video");
  const camFrame = document.createElement("canvas");   // offscreen: video → capped preview res
  const cam = { open: false, facing: "user", stream: null, raf: 0 };
  let camGen = 0;   // bumped on every close/capture/restart — invalidates an in-flight getUserMedia
  const gum = (c) => navigator.mediaDevices.getUserMedia(c);       // single patch point
  const hasGUM = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  function stopStream() {
    if (cam.stream) { cam.stream.getTracks().forEach((t) => t.stop()); cam.stream = null; }
  }
  async function startStream() {
    stopStream();
    const gen = ++camGen;
    const stream = await gum({ video: { facingMode: cam.facing }, audio: false });
    // Superseded by a close/capture/flip while gum() was pending? Stop the stream we just
    // got and bail — otherwise a live track outlives the surface (leaked camera light).
    if (gen !== camGen || !cam.open) { stream.getTracks().forEach((t) => t.stop()); return; }
    cam.stream = stream;
    camVideo.srcObject = stream;
    camVideo.play().catch(() => {});   // fire-and-forget: play() can stay pending when the tab
                                       // is backgrounded / autoplay is deferred; the render loop
                                       // only needs videoWidth, so never block open/flip on it.
  }
  function camLoop() {
    cancelAnimationFrame(cam.raf);
    const step = () => {
      if (!cam.open) return;
      if (camVideo.videoWidth) {
        const CAP = 720, vw = camVideo.videoWidth, vh = camVideo.videoHeight;
        const s = Math.min(1, CAP / Math.max(vw, vh));
        const pw = Math.max(1, Math.round(vw * s)), ph = Math.max(1, Math.round(vh * s));
        if (camFrame.width !== pw || camFrame.height !== ph) { camFrame.width = pw; camFrame.height = ph; }
        const cx = camFrame.getContext("2d");
        if (cam.facing === "user") { cx.setTransform(-1, 0, 0, 1, pw, 0); }   // mirror the selfie
        else cx.setTransform(1, 0, 0, 1, 0, 0);
        cx.drawImage(camVideo, 0, 0, pw, ph);
        engine.render(camFrame);                    // upload the frame + run the chain
        compositeTrim(canvas, $("cam-view"));        // same trim as the editor → WYSIWYG
      }
      cam.raf = requestAnimationFrame(step);
    };
    cam.raf = requestAnimationFrame(step);
  }
  async function openCamera() {
    $("cam-error").hidden = true; $("camera").hidden = false; cam.open = true;
    buildCamLooks();
    if (!hasGUM()) { showCamError(); return; }
    try { await startStream(); }
    catch (e) { console.error("[muse] camera denied:", e); showCamError(); return; }
    camLoop();
  }
  function closeCamera() {
    cam.open = false; camGen++;         // invalidate any in-flight gum() so it can't reopen a stream
    cancelAnimationFrame(cam.raf); cam.raf = 0;
    stopStream();
    camVideo.srcObject = null;
    $("camera").hidden = true;
    sourceDirty = true;                    // GPU srcTex holds a camera frame → force a real re-upload
    if (hasContent) draw();
  }
  function captureCamera() {
    if (!camVideo.videoWidth) return;
    const full = document.createElement("canvas");
    full.width = camVideo.videoWidth; full.height = camVideo.videoHeight;
    const cx = full.getContext("2d");
    if (cam.facing === "user") cx.setTransform(-1, 0, 0, 1, full.width, 0);   // capture matches the mirrored preview
    cx.drawImage(camVideo, 0, 0, full.width, full.height);
    cam.open = false; camGen++; cancelAnimationFrame(cam.raf); cam.raf = 0;
    stopStream(); camVideo.srcObject = null; $("camera").hidden = true;
    setSource(full);                       // lands in the editor with the current look applied (recipe continuity)
  }
  async function flipCamera() {
    const prev = cam.facing;
    cam.facing = cam.facing === "user" ? "environment" : "user";
    try { await startStream(); }
    catch (e) { cam.facing = prev; console.error("[muse] camera flip failed:", e); showCamError(); }
  }
  function showCamError() {                // denied / no device → in-app notice, no re-prompt loop
    stopStream();
    $("cam-error-msg").textContent = t("camDenied");
    $("cam-error").hidden = false;
  }
  function buildCamLooks() {
    const host = $("cam-looks"); host.textContent = "";
    const names = t("lookNames");
    for (const l of LOOKS) {
      const b = document.createElement("button");
      b.className = "cam-look"; b.type = "button"; b.dataset.look = l.id;
      b.textContent = names[l.id] || l.name;
      if (l.id === RECIPE.look) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => {   // live loop re-renders RECIPE → preview updates instantly
        thumbGen++; RECIPE = makeRecipe(l.id); syncLookStrip(); syncPanel(); syncCamLooks();
      });
      host.appendChild(b);
    }
  }
  function syncCamLooks() {
    for (const b of $("cam-looks").children) {
      if (b.dataset.look === RECIPE.look) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    }
  }
  $("hero-camera").addEventListener("click", openCamera);
  $("cam-open").addEventListener("click", openCamera);
  $("cam-close").addEventListener("click", closeCamera);
  $("cam-shutter").addEventListener("click", captureCamera);
  $("cam-flip").addEventListener("click", flipCamera);
  $("cam-error-upload").addEventListener("click", () => { closeCamera(); pick(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && cam.open) closeCamera(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cam.open) { e.stopPropagation(); closeCamera(); } }, true);
  if (hasGUM()) { $("hero-camera").hidden = false; $("cam-open").hidden = false; }

  /* ---- v2.0 Reference-Match (BYOK vision). Pick a reference + your key → visionMatch()
     (top-level seam) proposes a recipe; it's applied to the subject as a STAGED preview
     (revertible until Keep). Only the reference is sent; the subject never leaves. ---- */
  let matchRef = null;          // downscaled reference as a data-URI
  let matchReview = null;       // { prev } while a proposal is staged
  const matchScrim = $("match-scrim"), matchGo = $("match-go");
  function populateProviders() {
    const sel = $("match-provider"); sel.textContent = "";
    for (const id of Object.keys(PROVIDERS)) {
      const o = document.createElement("option"); o.value = id; o.textContent = PROVIDERS[id].label; sel.appendChild(o);
    }
    sel.value = store.get(STORE_KEYS.byokProvider) || Object.keys(PROVIDERS)[0];
    syncPrivacy();
  }
  function syncPrivacy() { $("match-privacy").textContent = t("matchPrivacy", PROVIDERS[$("match-provider").value].label); }
  function syncMatchEnabled() { matchGo.disabled = !(matchRef && $("match-key").value.trim()); }
  async function setReference(file) {
    if (!file || !/^image\/(png|jpeg|webp)$/i.test(file.type)) { toast(t("toastUnreadable"), "err"); return; }
    let bmp; try { bmp = await createImageBitmap(file); } catch (_) { toast(t("toastDecodeFail"), "err"); return; }
    const cap = 768, s = Math.min(1, cap / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * s)), h = Math.max(1, Math.round(bmp.height * s));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    matchRef = cv.toDataURL("image/jpeg", 0.85);
    const thumb = $("ref-thumb"); thumb.src = matchRef; thumb.hidden = false;
    $("ref-drop").classList.add("has-ref"); syncMatchEnabled();
  }
  function openMatch() {
    if (!hasContent) return;
    matchRef = null; $("ref-thumb").hidden = true; $("ref-drop").classList.remove("has-ref");
    populateProviders();
    $("match-key").value = store.get(STORE_KEYS.byokKey) || "";
    syncMatchEnabled();
    matchScrim.hidden = false;
    setTimeout(() => (matchRef ? matchGo : $("ref-drop")).focus && $("ref-drop").focus(), 0);
  }
  function closeMatch() { matchScrim.hidden = true; }
  async function runMatch() {
    const provider = $("match-provider").value, key = $("match-key").value.trim();
    if (!matchRef) { toast(t("matchNoRef"), "err"); return; }
    if (!key) { toast(t("matchNoKey"), "err"); return; }
    store.set(STORE_KEYS.byokProvider, provider); store.set(STORE_KEYS.byokKey, key);   // remember (settings)
    matchGo.disabled = true; const label = matchGo.textContent; matchGo.textContent = t("matchGoing");
    try {
      const proposal = await visionMatch(matchRef, { provider, key });
      closeMatch();
      enterReview(proposal);
    } catch (e) {
      console.error("[muse] match failed:", e);
      const m = e && e.message || "";
      toast(m === "no-key" ? t("matchNoKey") : m === "bad-json" ? t("matchBadJson") : t("matchHttpErr", m), "err");
    } finally { matchGo.textContent = label; syncMatchEnabled(); }
  }
  // Staged review: apply the proposal live but keep it revertible until Keep.
  function enterReview(proposal) {
    matchReview = { prev: getRecipe() };
    RECIPE = proposal; syncLookStrip(); syncPanel(); if (hasContent) draw();
    $("match-review").hidden = false;
    toast(t("matchApplied"));
  }
  function exitReview() { matchReview = null; $("match-review").hidden = true; }
  function discardMatch() { if (!matchReview) return; setRecipe(matchReview.prev); exitReview(); toast(t("matchDiscarded")); }
  function keepMatch() { exitReview(); toast(t("matchKept")); }        // proposal already live
  function editMatch() { exitReview(); openDrawer(); }                 // keep proposal, jump to Adjust
  // Wiring
  $("match-open").addEventListener("click", openMatch);
  $("match-cancel").addEventListener("click", closeMatch);
  $("match-go").addEventListener("click", runMatch);
  $("match-key").addEventListener("input", syncMatchEnabled);
  $("match-provider").addEventListener("change", () => { syncPrivacy(); });
  $("match-clear-key").addEventListener("click", () => { store.del(STORE_KEYS.byokKey); $("match-key").value = ""; syncMatchEnabled(); toast(t("matchClearKey")); });
  $("ref-input").addEventListener("change", () => { const f = $("ref-input").files && $("ref-input").files[0]; $("ref-input").value = ""; setReference(f); });
  const refDrop = $("ref-drop");
  refDrop.addEventListener("dragover", (e) => { e.preventDefault(); refDrop.classList.add("drag"); });
  refDrop.addEventListener("dragleave", () => refDrop.classList.remove("drag"));
  refDrop.addEventListener("drop", (e) => { e.preventDefault(); refDrop.classList.remove("drag"); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setReference(f); });
  matchScrim.addEventListener("pointerdown", (e) => { if (e.target === matchScrim) closeMatch(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !matchScrim.hidden) { e.stopPropagation(); closeMatch(); } }, true);
  $("match-discard").addEventListener("click", discardMatch);
  $("match-keep").addEventListener("click", keepMatch);
  $("match-edit").addEventListener("click", editMatch);
  // Hold-to-compare: show the pre-match recipe while pressed.
  const cmp = $("match-compare");
  cmp.addEventListener("pointerdown", (e) => { e.preventDefault(); if (matchReview) { cmp._live = RECIPE; RECIPE = deserialiseRecipe(matchReview.prev); if (hasContent) draw(); } });
  const cmpRelease = () => { if (matchReview && cmp._live) { RECIPE = cmp._live; cmp._live = null; if (hasContent) draw(); } };
  cmp.addEventListener("pointerup", cmpRelease); cmp.addEventListener("pointerleave", cmpRelease); cmp.addEventListener("pointercancel", cmpRelease);

  // Static strings (all through the lang map — §13)
  $("open-image").textContent = t("miOpen");
  $("export").textContent = t("exportBtn");
  $("save-preset").textContent = t("miSave");
  $("import-recipe").textContent = t("miImport");
  $("export-jpeg").textContent = t("miExportJpeg");
  $("match-open").textContent = t("miMatch");
  $("match-title").textContent = t("matchTitle");
  $("ref-drop-label").textContent = t("refDropLabel");
  $("match-key").placeholder = t("matchKeyPh");
  $("match-clear-key").textContent = t("matchClearKey");
  $("match-cancel").textContent = t("cancel");
  $("match-go").textContent = t("matchGo");
  $("match-discard").textContent = t("matchDiscard");
  $("match-compare").textContent = t("matchCompare");
  $("match-review-label").textContent = t("matchReviewLabel");
  $("match-edit").textContent = t("matchEdit");
  $("match-keep").textContent = t("matchKeep");
  $("menu-btn").setAttribute("aria-label", t("more"));
  $("menu-btn").setAttribute("title", t("more"));
  // On touch devices there's no "drop" — use "Open" as the verb (G-M5).
  $("hero-title").textContent = matchMedia("(pointer: coarse)").matches ? t("heroTitleTouch") : t("heroTitle");
  $("hero-sub").textContent = t("heroSub");
  $("hero-open").textContent = t("heroOpen");
  $("hero-camera").textContent = t("camUse");
  $("cam-open").textContent = t("camUse");
  $("cam-error-upload").textContent = t("camToUpload");
  $("sample-label").textContent = t("sampleLabel");
  $("sample-credit").textContent = t("sampleCredit");
  $("sib-label").textContent = t("sibLabel");
  buildSampleGallery();

  // Adjust-drawer static strings + build the panel once, synced to RECIPE.
  $("adjust").textContent = t("adjust");
  $("drawer-title").textContent = t("drawerTitle");
  $("seed-label").textContent = t("seedLabel");
  $("seed-label").setAttribute("title", t("seedTitle"));
  $("seed-input").setAttribute("title", t("seedTitle"));
  $("help").textContent = t("miHelp");
  // a11y attribute strings through the map (locale-overridable — §13)
  $("view").setAttribute("aria-label", t("a11yPreview"));
  $("lookstrip").setAttribute("aria-label", t("a11yLooks"));
  $("drawer").setAttribute("aria-label", t("adjust"));
  $("drawer-close").setAttribute("aria-label", t("close"));
  $("seed-shuffle").setAttribute("title", t("shuffleSeed"));

  buildLookStrip();
  buildPanel();
  syncPanel();
  $("engine-status").textContent = t("engineReady", chainCount());   // footer live before first draw

  /* ---- Before / after (B4): hold shows the untouched source ---- */
  let peeking = false;
  function drawOriginal() {
    const src = currentSource();
    const vx = view.getContext("2d");
    vx.clearRect(0, 0, view.width, view.height);
    vx.drawImage(src, 0, 0, view.width, view.height);
  }
  function peek(on) {
    if (!hasContent) return;
    if (on && !peeking) { peeking = true; drawOriginal(); }
    else if (!on && peeking) { peeking = false; draw(); }
  }
  // Hold-to-compare: require a deliberate ~200ms press before flashing the original,
  // and cancel if the finger drifts >8px — so a light thumb-brush or a tap doesn't
  // accidentally flip to Original (G-H2). Keyboard Space still peeks instantly.
  let holdTimer = null, holdStart = null;
  const clearHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
  view.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    holdStart = { x: e.clientX, y: e.clientY };
    clearHold();
    holdTimer = setTimeout(() => { holdTimer = null; peek(true); }, 200);
  });
  view.addEventListener("pointermove", (e) => {
    if (holdStart && Math.hypot(e.clientX - holdStart.x, e.clientY - holdStart.y) > 8) { clearHold(); if (peeking) peek(false); }
  });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) {
    view.addEventListener(ev, () => { clearHold(); holdStart = null; peek(false); });
  }

  /* ---- Help + intro modals (B8) ---- */
  async function showHelp() {
    const node = document.createElement("div");
    const p = document.createElement("p"); p.textContent = t("privacyLine"); node.appendChild(p);
    const dl = document.createElement("dl");
    for (const [k, d] of t("shortcuts")) {
      const dt = document.createElement("dt"); const kbd = document.createElement("kbd"); kbd.textContent = k; dt.appendChild(kbd);
      const dd = document.createElement("dd"); dd.textContent = d;
      dl.append(dt, dd);
    }
    node.appendChild(dl);
    await openModal({ title: t("helpTitle"), node, actions: [{ label: t("close"), value: true, primary: true }], wide: true });
  }
  $("help").addEventListener("click", showHelp);

  /* ---- ⋯ overflow menu: in-app popover holding the secondary actions.
     Open image / Save preset / Import recipe / Help each keep their own handlers
     (bound above); this only toggles the popover and dismisses it after a pick. ---- */
  const menuBtn = $("menu-btn");
  const overflowMenu = $("overflow-menu");
  function setMenu(open) {
    overflowMenu.hidden = !open;
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) {
      const first = overflowMenu.querySelector(".menu-item:not([hidden])");
      if (first) setTimeout(() => first.focus(), 0);
    }
  }
  const closeMenu = (refocus) => { if (!overflowMenu.hidden) { setMenu(false); if (refocus) menuBtn.focus(); } };
  menuBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(overflowMenu.hidden); });
  // Activating any item runs its own handler (elsewhere) then dismisses the menu.
  overflowMenu.addEventListener("click", (e) => { if (e.target.closest(".menu-item")) closeMenu(false); });
  $("import-recipe").addEventListener("click", () => presetFileInput.click());
  // Dismiss on outside tap …
  document.addEventListener("pointerdown", (e) => {
    if (overflowMenu.hidden) return;
    if (e.target.closest("#overflow-menu") || e.target.closest("#menu-btn")) return;
    closeMenu(false);
  });
  // … and on Esc (capture-phase + stop, so the panel/dialog shortcut below doesn't also fire).
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !overflowMenu.hidden) { e.stopPropagation(); closeMenu(true); }
  }, true);

  async function maybeShowIntro() {
    if (store.get(STORE_KEYS.intro)) return;
    await openModal({ title: t("introTitle"), body: t("introBody"), actions: [{ label: t("gotIt"), value: true, primary: true }] });
    store.set(STORE_KEYS.intro, "1");
  }

  /* ---- Keyboard shortcuts (B9). Ignored while typing or a dialog is open,
     except Space (before/after) and the always-safe combos. ---- */
  const LOOK_KEYS = { "1": "sorrenti", "2": "corinne", "3": "disposable", "4": "mall", "0": "none" };
  const typingIn = (el) => el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  const modalOpen = () => !!document.querySelector(".modal-scrim") || !$("match-scrim").hidden;
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); if (hasContent) exportImage(); return; }
    if (typingIn(document.activeElement) || modalOpen()) return;   // Esc handled by drawer/modal owners
    if (e.key === " " && !e.repeat) { e.preventDefault(); peek(true); return; }
    if (e.key === "?" || (e.shiftKey && e.key === "/")) { e.preventDefault(); showHelp(); return; }
    if (e.key in LOOK_KEYS) { e.preventDefault(); if (hasContent) setLook(LOOK_KEYS[e.key]); return; }
  });
  document.addEventListener("keyup", (e) => { if (e.key === " ") peek(false); });

  // (The old topbar "Sample" button was removed — the CC0 gallery is the sampler now.
  //  loadSample() stays for internal use; the determinism gate drives makeSampleImage.)

  // M0 harness / proto agent-face handle. The determinism verifier (A10) drives
  // exactly these entry points — one pipeline, two doors (§8). setVariant forces
  // sample mode + a fresh upload so the gate's fixed image renders regardless of
  // what's loaded interactively.
  window.__muse_m0 = {
    gl, engine, view, makeSampleImage,
    redraw: draw,
    setVariant: (n) => { sourceImage = null; variant = ((n % 6) + 6) % 6; sourceDirty = true; hasContent = true; draw(); },
    getRecipe, setRecipe, setLook,
    serialiseRecipe, deserialiseRecipe, makeRecipe,
    LOOKS: LOOKS.map((l) => ({ id: l.id, name: l.name })),
    chainCount,
    // Final output — the composited visible canvas, trim included. This is
    // what the M0 determinism page hashes.
    snapshot: () => view.getContext("2d").getImageData(0, 0, view.width, view.height).data,
  };

  // i18n coverage hook for the M1 self-test: the live set of defined lang keys.
  window.__muse_i18n = { locale: LOCALE, keys: Object.keys(LANG[LOCALE] || LANG.en) };

  /* ---- Agent face (§8): window.muse, gated behind muse.dev, off by default.
     Same pipeline the UI drives — one mechanism, two doors — and the headless
     test surface for M1. applyLook renders an arbitrary source off to the side
     and restores the interactive state after. Exports mark via:"agent". ---- */
  const getLooks = () => LOOKS.map((l) => ({ id: l.id, name: l.name, params: JSON.parse(JSON.stringify(l.params || {})) }));

  async function toDrawable(source) {
    if (source instanceof Blob) return await createImageBitmap(source);
    if (typeof ImageData !== "undefined" && source instanceof ImageData) return source;   // texImage2D accepts ImageData
    if (source && source.width && (source.getContext || source.naturalWidth || source.close)) return source;   // canvas/bitmap/img
    throw new Error("applyLook: source must be a Blob, ImageData, or drawable");
  }
  async function renderToPNG(recipe) {
    const blob = await new Promise((res) => view.toBlob(res, "image/png"));
    if (!blob) throw new Error("toBlob returned null");
    const withRecipe = embedRecipePNG(new Uint8Array(await blob.arrayBuffer()), serialiseRecipe(recipe));
    return new Blob([withRecipe], { type: "image/png" });
  }
  async function applyLook(source, lookIdOrParams, opts = {}) {
    const img = await toDrawable(source);
    const rec = typeof lookIdOrParams === "string" ? makeRecipe(lookIdOrParams) : deserialiseRecipe(lookIdOrParams);
    if (opts.seed != null) rec.seed = opts.seed >>> 0;
    rec.via = "agent";
    const prev = RECIPE;                       // render off the current state, then restore
    try {
      RECIPE = rec;
      engine.render(img); compositeTrim(canvas, view);
      return await renderToPNG(rec);
    } finally {
      RECIPE = prev; sourceDirty = true; if (hasContent) draw();   // restore even if encoding throws
    }
  }
  async function agentExport(opts = {}) {
    if (!hasContent) throw new Error("muse.export: no image loaded");
    const rec = Object.assign(getRecipe(), { via: "agent" });
    if ((opts.format || "png") === "png") return renderToPNG(rec);
    // JPEG path: embed the recipe in a COM marker (E2), same artifact guarantee as PNG.
    const blob = await new Promise((res) => view.toBlob(res, "image/jpeg", 0.92));
    if (!blob) throw new Error("toBlob returned null");
    const withRecipe = embedRecipeJPEG(new Uint8Array(await blob.arrayBuffer()), serialiseRecipe(rec));
    return new Blob([withRecipe], { type: "image/jpeg" });
  }
  function installAgentFace() {
    window.muse = { getLooks, applyLook, getRecipe: () => getRecipe(), setRecipe: (j) => setRecipe(j), export: agentExport };
  }
  // Dev toggle without a reload — the self-test flips this on; off by default (§8).
  window.__museDev = (on) => {
    if (on) { store.set(STORE_KEYS.dev, "1"); installAgentFace(); }
    else { store.del(STORE_KEYS.dev); try { delete window.muse; } catch (_) { window.muse = undefined; } }
    return !!store.get(STORE_KEYS.dev);
  };
  if (store.get(STORE_KEYS.dev)) installAgentFace();

  // Expose the loaders + draw for the M1 editor layers (sliders, presets, export)
  // and the M1 self-test to drive. Kept separate from the frozen M0 face above.
  boot.editor = { loadFile, loadSample, setSource, setLook, setRecipe, getRecipe, draw,
                  toast, revealEditor, get hasContent() { return hasContent; },
                  markDirty: () => { sourceDirty = true; }, chainCount, view,
                  // Camera hooks for the M2 self-test — same code the UI drives; the test
                  // patches navigator.mediaDevices.getUserMedia (canvas captureStream) first.
                  cameraAPI: {
                    open: openCamera, capture: captureCamera, close: closeCamera, flip: flipCamera,
                    state: () => ({ open: cam.open, facing: cam.facing,
                      tracks: cam.stream ? cam.stream.getTracks().length : 0,
                      errorShown: !$("cam-error").hidden, previewW: $("cam-view").width }),
                    // Synchronous preview-cost probe for m2-perf: times the exact per-frame
                    // work (chain render + trim composite) against a synthetic 640×480 frame,
                    // independent of rAF/tab-visibility. compositeTrim's drawImage of the GL
                    // canvas forces the frame to complete, so each sample includes GPU time.
                    perfProbe: (frames) => {
                      const test = document.createElement("canvas"); test.width = 640; test.height = 480;
                      const tx = test.getContext("2d");
                      tx.fillStyle = "#5a7a99"; tx.fillRect(0, 0, 640, 480);
                      tx.fillStyle = "#e8d0b0"; tx.beginPath(); tx.arc(320, 240, 96, 0, 7); tx.fill();
                      const camView = $("cam-view"), ds = [];
                      for (let i = 0; i < 5; i++) { engine.render(test); compositeTrim(canvas, camView); }   // warm up
                      for (let i = 0; i < frames; i++) { const t = performance.now(); engine.render(test); compositeTrim(canvas, camView); ds.push(performance.now() - t); }
                      sourceDirty = true; if (hasContent) draw();   // restore the editor's real source
                      return ds;
                    },
                  },
                  // Reference-match hooks for the m3 self-test (same code the UI drives;
                  // the test mocks window.fetch so visionMatch runs key-free).
                  matchAPI: {
                    open: openMatch, close: closeMatch, run: runMatch,
                    setRef: (dataURI) => { matchRef = dataURI; $("ref-drop").classList.add("has-ref"); syncMatchEnabled(); },
                    setProvider: (p) => { $("match-provider").value = p; syncPrivacy(); },
                    setKey: (k) => { $("match-key").value = k; syncMatchEnabled(); },
                    discard: discardMatch, keep: keepMatch, edit: editMatch,
                    state: () => ({ open: !matchScrim.hidden, reviewing: !!matchReview, canMatch: !matchGo.disabled,
                      keyStored: !!store.get(STORE_KEYS.byokKey) }),
                  },
                  // Preset hooks for the M1 self-test (same code the UI drives).
                  presetAPI: {
                    save(name) { presets.push({ name, recipe: getRecipe() }); savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs(); return presets.length; },
                    list() { return presets.map((p) => p.name); },
                    apply(i) { setRecipe(presets[i].recipe); },
                    clear() { presets.length = 0; savePresets(); buildLookStrip(); syncLookStrip(); },
                  } };

  maybeShowIntro();
  gaPageview();   // one anonymous pageview; image data never touches the network
  console.log("[muse] editor up ·", chainCount(), "pass(es) · look:", RECIPE.look);
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
