/* Focus-trap Tab within a container (drawer/modal share this shape). */
function trapTab(e, container) {
  const f = container.querySelectorAll("button, [href], input, select, [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* localStorage wrapper — only presets/lang/intro/dev live here (§5); never image
   data. Wrapped so a locked-down storage (private mode, file://) fails soft. */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} },
};
const STORE_KEYS = { presets: "muse.presets", lang: "muse.lang", intro: "muse.intro", dev: "muse.dev" };

/* Analytics — a single stateless GA4 page_view beacon (§11: pageview-only). No
   gtag.js (keeps zero-CDN), no cookie, no persisted client id — the cid is
   ephemeral, generated per load, so there is no cross-visit tracking. It never
   sends image data, filenames, or PII, and fires once, only on the deployed
   https origin (so local/dev/gate runs stay silent and CSP-clean). */
const GA_ID = "G-W7DM58QMS3";
function gaPageview() {
  try {
    if (location.protocol !== "https:") return;
    if (/^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname)) return;
    const rnd = () => Math.floor(Math.random() * 1e10);
    const p = new URLSearchParams({
      v: "2", tid: GA_ID, cid: rnd() + "." + rnd(),   // ephemeral client id, never stored
      en: "page_view",
      dl: location.origin + location.pathname,          // path only — no query/hash, no filenames
      dt: "Muse",                                       // fixed title, never the image name
      ul: (navigator.language || "en").toLowerCase(),
      sr: (screen.width || 0) + "x" + (screen.height || 0),
      _s: "1", sid: String(Date.now()), sct: "1", seg: "1",
    });
    const url = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (navigator.sendBeacon) navigator.sendBeacon(url);
    else fetch(url, { method: "POST", mode: "no-cors", keepalive: true }).catch(() => {});
  } catch (_) {}
}

/* ---- Boot ---- */
function boot() {
  // static strings
  $("reload-sample").textContent = t("reloadSample");
  $("ver").textContent = t("version");

  const gl = getGL();
  if (!gl) { showFatal(); return; }

  let engine;
  try {
    engine = makeEngine(gl);
  } catch (e) {
    console.error("[muse] engine init failed:", e);
    showFatal();
    return;
  }

  let variant = 0;
  let sourceImage = null;   // loaded user image (ImageBitmap/canvas); null → procedural sample
  let sourceDirty = true;   // GPU source needs (re)upload before next render
  let hasContent = false;   // something has been rendered → hero dismissed, editor live

  // Full-chain count: active GL passes + the trim compositor when enabled.
  const chainCount = () => engine.activeCount() + (RECIPE.params.trim.bypass ? 0 : 1);
  const currentSource = () => sourceImage || makeSampleImage(1024, 768, variant);
  // sourceDirty splits upload from re-render: param-only edits (sliders, looks)
  // skip the re-upload, so dragging a slider on a big photo stays smooth.
  function draw() {
    if (sourceDirty) { engine.render(currentSource()); sourceDirty = false; }
    else { engine.render(); }
    compositeTrim(canvas, view);
    $("engine-status").textContent = t("engineReady", chainCount());
  }

  /* ---- In-app toasts (never native alert/confirm — handoff §12) ---- */
  const toastHost = $("toasts");
  function toast(msg, kind) {
    const el = document.createElement("div");
    el.className = "toast" + (kind === "err" ? " err" : "");
    el.textContent = msg;
    toastHost.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .3s"; el.style.opacity = "0";
      setTimeout(() => el.remove(), 320);
    }, kind === "err" ? 5200 : 4200);
  }

  /* ---- Source loading: hero → live editor ---- */
  const hero = $("hero");
  function revealEditor() {
    hasContent = true;
    hero.classList.add("hidden");
    $("export").hidden = false;
    $("save-preset").hidden = false;
    $("adjust").hidden = false;
  }
  function setSource(img) { sourceImage = img; sourceDirty = true; revealEditor(); draw(); refreshThumbs(); }
  function loadSample() { sourceImage = null; sourceDirty = true; revealEditor(); draw(); refreshThumbs(); }

  const MAX_MP = 24;   // >24MP → downscale for preview (handoff §4)
  async function loadFile(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) { toast(t("toastUnreadable"), "err"); return; }
    // Sniff an embedded Muse recipe (PNG tEXt) before we throw the bytes away.
    let recipeStr = null;
    if (/png/i.test(file.type)) {
      try { recipeStr = readRecipePNG(new Uint8Array(await file.arrayBuffer())); } catch (_) {}
    }
    let bmp;
    try {
      bmp = await createImageBitmap(file, { imageOrientation: "from-image" });  // respect EXIF rotation
    } catch (e) {
      console.error("[muse] decode failed:", e); toast(t("toastDecodeFail"), "err"); return;
    }
    let img = bmp;
    const mp = (bmp.width * bmp.height) / 1e6;
    if (mp > MAX_MP) {
      const s = Math.sqrt(MAX_MP / mp);
      const cw = Math.max(1, Math.round(bmp.width * s)), ch = Math.max(1, Math.round(bmp.height * s));
      const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
      cv.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
      img = cv;
      toast(t("toastDownscaled", mp.toFixed(0)));
    }
    setSource(img);
    if (recipeStr) promptRestore(recipeStr);   // in-app confirm, never native (§4)
  }

  // Recipe carried in a dropped image → offer to restore the exact edit (§4).
  async function promptRestore(recipeStr) {
    const yes = await openModal({
      title: t("recipeFoundTitle"),
      body: t("recipeFoundBody"),
      actions: [
        { label: t("restore"), value: true, primary: true },
        { label: t("keepAsIs"), value: false },
      ],
      dismissValue: false,
    });
    if (yes) { try { setRecipe(JSON.parse(recipeStr)); } catch (e) { console.error("[muse] recipe restore failed:", e); } }
  }

  // Export the composited frame with its recipe embedded (§6). FSA primary,
  // <a download> fallback. via omitted here (a UI export, not an agent one).
  async function exportImage() {
    if (!hasContent) return;
    try {
      const blob = await new Promise((res) => view.toBlob(res, "image/png"));
      if (!blob) throw new Error("toBlob returned null");
      const withRecipe = embedRecipePNG(new Uint8Array(await blob.arrayBuffer()), serialiseRecipe(RECIPE));
      const result = await saveBlob(new Blob([withRecipe], { type: "image/png" }), `muse-${RECIPE.look}.png`);
      if (result === "cancelled") toast(t("exportCancelled"));
      else toast(t("exportDone"));
    } catch (e) {
      console.error("[muse] export failed:", e); toast(t("exportFail"), "err");
    }
  }
  $("export").addEventListener("click", exportImage);

  // File picker + drag/drop. Window-level dragover/drop preventDefault stops the
  // browser from navigating away when a photo lands outside the stage.
  const fileInput = $("file-input");
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = "";                     // let the same file be re-picked
    loadFile(f);
  });
  const pick = () => fileInput.click();
  $("open-image").addEventListener("click", pick);
  $("hero-open").addEventListener("click", pick);
  $("hero-sample").addEventListener("click", loadSample);

  const stage = document.querySelector(".stage");
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  stage.addEventListener("dragenter", (e) => { stop(e); hero.classList.add("drag"); });
  stage.addEventListener("dragover", (e) => { stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; hero.classList.add("drag"); });
  stage.addEventListener("dragleave", (e) => { stop(e); if (e.target === stage || e.target === hero) hero.classList.remove("drag"); });
  stage.addEventListener("drop", (e) => { stop(e); hero.classList.remove("drag"); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadFile(f); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  // Look strip — one pill per look, then custom presets (B5). Active state:
  // a preset if the current recipe matches one exactly, else the base look.
  const strip = $("lookstrip");
  let presets = (() => {
    try { const a = JSON.parse(store.get(STORE_KEYS.presets) || "[]"); return Array.isArray(a) ? a : []; }
    catch (_) { return []; }
  })();
  const savePresets = () => store.set(STORE_KEYS.presets, JSON.stringify(presets));

  function buildLookStrip() {
    strip.textContent = "";
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = t("lookLabel");
    strip.appendChild(lbl);
    const names = t("lookNames");
    for (const lk of LOOKS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "look"; b.dataset.look = lk.id;
      const img = document.createElement("img"); img.className = "thumb"; img.alt = "";
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = names[lk.id] || lk.name;
      b.append(img, nm);
      // Era decade label (a prop, locale-independent like the date stamp — §13).
      if (lk.era) { const e = document.createElement("span"); e.className = "era"; e.textContent = lk.era; b.appendChild(e); }
      b.addEventListener("click", () => setLook(lk.id));
      strip.appendChild(b);
    }
    presets.forEach((pr, i) => {
      const wrap = document.createElement("span"); wrap.className = "preset-wrap";
      const b = document.createElement("button");
      b.type = "button"; b.className = "look"; b.dataset.preset = String(i);
      b.textContent = pr.name || t("unnamed");
      b.addEventListener("click", () => setRecipe(pr.recipe));
      const del = document.createElement("button");
      del.type = "button"; del.className = "look-del"; del.textContent = "✕";
      del.setAttribute("aria-label", t("deletePreset", pr.name || t("unnamed")));
      del.addEventListener("click", (e) => { e.stopPropagation(); presets.splice(i, 1); savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs(); toast(t("presetDeleted")); });
      wrap.append(b, del); strip.appendChild(wrap);
    });
  }
  function syncLookStrip() {
    const cur = serialiseRecipe(RECIPE);
    const activePreset = presets.findIndex((pr) => serialiseRecipe(deserialiseRecipe(pr.recipe)) === cur);
    for (const b of strip.querySelectorAll(".look")) {
      if (b.dataset.preset != null) b.setAttribute("aria-pressed", String(+b.dataset.preset === activePreset));
      else b.setAttribute("aria-pressed", String(activePreset < 0 && b.dataset.look === RECIPE.look));
    }
  }

  /* ---- Presets: save (localStorage) + .muse.json import/export (own transport) ---- */
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const presetFileInput = document.createElement("input");
  presetFileInput.type = "file"; presetFileInput.accept = ".muse.json,.json,application/json";
  presetFileInput.className = "visually-hidden";
  document.body.appendChild(presetFileInput);
  presetFileInput.addEventListener("change", async () => {
    const f = presetFileInput.files && presetFileInput.files[0]; presetFileInput.value = "";
    if (!f) return;
    try { setRecipe(deserialiseRecipe(JSON.parse(await f.text()))); toast(t("jsonImported")); }
    catch (e) { console.error("[muse] json import failed:", e); toast(t("jsonInvalid"), "err"); }
  });
  async function doSavePreset() {
    const node = document.createElement("div");
    const input = document.createElement("input");
    input.className = "field"; input.type = "text"; input.placeholder = t("presetNamePlaceholder"); input.maxLength = 40;
    node.appendChild(input);
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:8px;margin-top:12px;flex-wrap:wrap";
    const exp = document.createElement("button"); exp.type = "button"; exp.className = "btn"; exp.textContent = t("exportJson");
    exp.addEventListener("click", () => downloadBlob(new Blob([serialiseRecipe(RECIPE)], { type: "application/json" }), `muse-${RECIPE.look}.muse.json`));
    const imp = document.createElement("button"); imp.type = "button"; imp.className = "btn"; imp.textContent = t("importJson");
    imp.addEventListener("click", () => presetFileInput.click());
    row.append(exp, imp); node.appendChild(row);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const ok = node.closest(".modal").querySelector(".btn.primary"); ok && ok.click(); } });
    setTimeout(() => input.focus(), 0);
    const ok = await openModal({ title: t("savePresetTitle"), node, actions: [{ label: t("save"), value: true, primary: true }, { label: t("cancel"), value: false }], dismissValue: false });
    if (ok) {
      const name = (input.value || "").trim() || t("unnamed");
      presets.push({ name, recipe: getRecipe() });
      savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs();
      toast(t("presetSaved", name));
    }
  }
  $("save-preset").addEventListener("click", doSavePreset);

  /* ---- Look-deck thumbnails (B2): each base-look pill previews that look on the
     loaded image. Rendered small off the current state, then restored. Refreshed
     only on a source change (not on every look switch — the source is what varies). ---- */
  function refreshThumbs() {
    if (!hasContent) return;
    const src = currentSource();
    const tw = 152, th = Math.max(1, Math.round(tw * (src.height / src.width))) || 114;
    const small = document.createElement("canvas"); small.width = tw; small.height = th;
    small.getContext("2d").drawImage(src, 0, 0, tw, th);
    const prev = RECIPE;
    try {
      for (const b of strip.querySelectorAll(".look[data-look]")) {
        RECIPE = makeRecipe(b.dataset.look);
        engine.render(small); compositeTrim(canvas, view);
        const img = b.querySelector("img.thumb");
        if (img) { img.src = view.toDataURL("image/jpeg", 0.72); b.classList.add("has-thumb"); }
      }
    } finally {
      RECIPE = prev; sourceDirty = true; draw();   // restore even if a render throws
    }
  }

  /* ---- Slider panel (B3): fieldset per pass, per-pass bypass, tokenised ranges.
     panelSync[] holds one updater per control so a look/recipe change reflects
     into every input in O(controls). ---- */
  const drawer = $("drawer"), drawerBody = $("drawer-body"), seedInput = $("seed-input");
  const passNames = t("passNames"), ctlNames = t("ctl"), rgbSub = t("rgbSub");
  const panelSync = [];
  const fmtVal = (v, step) => Number(v).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3);
  const getP = (pass, prop, idx) => { const v = RECIPE.params[pass][prop]; return idx == null ? v : v[idx]; };
  const setP = (pass, prop, idx, val) => { if (idx == null) RECIPE.params[pass][prop] = val; else RECIPE.params[pass][prop][idx] = val; };

  function buildPanel() {
    drawerBody.textContent = ""; panelSync.length = 0;
    for (const grp of PANEL) {
      const fs = document.createElement("fieldset");
      fs.className = "pass"; fs.dataset.pass = grp.pass;
      const lg = document.createElement("legend");
      const nm = document.createElement("span"); nm.textContent = passNames[grp.pass] || grp.pass; lg.appendChild(nm);
      const sw = document.createElement("label"); sw.className = "sw";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "toggle";
      cb.setAttribute("aria-label", (passNames[grp.pass] || grp.pass) + " " + t("bypassOn"));
      const swt = document.createElement("span"); swt.textContent = t("bypassOn");
      sw.appendChild(cb); sw.appendChild(swt); lg.appendChild(sw); fs.appendChild(lg);
      cb.addEventListener("change", () => { RECIPE.params[grp.pass].bypass = !cb.checked; fs.dataset.bypassed = cb.checked ? "0" : "1"; if (hasContent) draw(); });
      panelSync.push(() => { const on = !RECIPE.params[grp.pass].bypass; cb.checked = on; fs.dataset.bypassed = on ? "0" : "1"; });

      for (const c of grp.controls) {
        const wrap = document.createElement("div"); wrap.className = "ctl";
        if (c.rgb) {
          wrap.classList.add("rgb");
          const lab = document.createElement("div"); lab.className = "lab";
          const t1 = document.createElement("span"); t1.textContent = ctlNames[c.key] || c.key;
          const val = document.createElement("span"); val.className = "val";
          lab.append(t1, val); wrap.appendChild(lab);
          const triple = document.createElement("div"); triple.className = "triple";
          const ins = [];
          for (let i = 0; i < 3; i++) {
            const col = document.createElement("div");
            const r = document.createElement("input"); r.type = "range"; r.min = c.min; r.max = c.max; r.step = c.step;
            r.setAttribute("aria-label", (ctlNames[c.key] || c.key) + " " + rgbSub[i]);
            const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = rgbSub[i];
            col.append(r, sub); triple.appendChild(col); ins.push(r);
            r.addEventListener("input", () => { setP(grp.pass, c.prop, i, parseFloat(r.value)); val.textContent = ins.map((x) => fmtVal(x.value, c.step)).join(" "); if (hasContent) draw(); });
          }
          wrap.appendChild(triple);
          panelSync.push(() => { for (let i = 0; i < 3; i++) ins[i].value = getP(grp.pass, c.prop, i); val.textContent = ins.map((x) => fmtVal(x.value, c.step)).join(" "); });
        } else if (c.kind === "select") {
          const lab = document.createElement("label"); lab.className = "lab"; lab.textContent = ctlNames[c.key] || c.key; wrap.appendChild(lab);
          const sel = document.createElement("select"); sel.className = "field";
          for (const opt of c.options) { const o = document.createElement("option"); o.value = opt; o.textContent = opt === "none" ? ctlNames.none : opt; sel.appendChild(o); }
          sel.addEventListener("change", () => { RECIPE.params[grp.pass][c.prop] = sel.value; if (hasContent) draw(); });
          wrap.appendChild(sel);
          panelSync.push(() => { sel.value = RECIPE.params[grp.pass][c.prop]; });
        } else if (c.kind === "toggle") {
          const lab = document.createElement("label"); lab.style.cssText = "display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer";
          const cbx = document.createElement("input"); cbx.type = "checkbox"; cbx.className = "toggle";
          const span = document.createElement("span"); span.textContent = ctlNames[c.key] || c.key;
          lab.append(cbx, span); wrap.appendChild(lab);
          cbx.addEventListener("change", () => { RECIPE.params[grp.pass][c.prop] = cbx.checked; if (hasContent) draw(); });
          panelSync.push(() => { cbx.checked = !!RECIPE.params[grp.pass][c.prop]; });
        } else {
          const lab = document.createElement("div"); lab.className = "lab";
          const t1 = document.createElement("span"); t1.textContent = ctlNames[c.key] || c.key;
          const val = document.createElement("span"); val.className = "val";
          lab.append(t1, val); wrap.appendChild(lab);
          const r = document.createElement("input"); r.type = "range"; r.min = c.min; r.max = c.max; r.step = c.step;
          r.setAttribute("aria-label", ctlNames[c.key] || c.key);
          r.addEventListener("input", () => { setP(grp.pass, c.prop, null, parseFloat(r.value)); val.textContent = fmtVal(r.value, c.step); if (hasContent) draw(); });
          wrap.appendChild(r);
          panelSync.push(() => { r.value = getP(grp.pass, c.prop, null); val.textContent = fmtVal(r.value, c.step); });
        }
        fs.appendChild(wrap);
      }
      drawerBody.appendChild(fs);
    }
  }
  function syncPanel() { for (const f of panelSync) f(); seedInput.value = RECIPE.seed; }

  // Seed: numeric field + deterministic shuffle (LCG step, no Math.random).
  seedInput.addEventListener("change", () => { RECIPE.seed = Math.max(0, Math.floor(Number(seedInput.value) || 0)) >>> 0; seedInput.value = RECIPE.seed; if (hasContent) draw(); });
  $("seed-shuffle").addEventListener("click", () => { RECIPE.seed = (RECIPE.seed * 1664525 + 1013904223) >>> 0; seedInput.value = RECIPE.seed; if (hasContent) draw(); });

  // Drawer open/close with focus trap + Esc (a11y — B9).
  const adjustBtn = $("adjust");
  let drawerOpen = false, drawerKey = null;
  function openDrawer() {
    if (drawerOpen) return;
    drawer.hidden = false; requestAnimationFrame(() => drawer.classList.add("open"));
    drawerOpen = true; adjustBtn.setAttribute("aria-expanded", "true");
    drawerKey = (e) => { if (e.key === "Escape") { e.preventDefault(); closeDrawer(); } else if (e.key === "Tab") trapTab(e, drawer); };
    document.addEventListener("keydown", drawerKey, true);
    const first = drawer.querySelector("button, input, select"); first && first.focus();
  }
  function closeDrawer() {
    if (!drawerOpen) return;
    drawer.classList.remove("open"); drawerOpen = false; adjustBtn.setAttribute("aria-expanded", "false");
    document.removeEventListener("keydown", drawerKey, true);
    setTimeout(() => { if (!drawerOpen) drawer.hidden = true; }, 220);
    adjustBtn.focus();
  }
  adjustBtn.addEventListener("click", () => (drawerOpen ? closeDrawer() : openDrawer()));
  $("drawer-close").addEventListener("click", closeDrawer);

  // State mutations funnel through these so strip, panel, and canvas stay in sync —
  // the same one mechanism the agent face (§8) drives. Param-only changes don't
  // re-upload the source (sourceDirty stays false). Draw is deferred until there's
  // content, so choosing a look before loading an image doesn't paint behind the hero.
  function setLook(id) { RECIPE = makeRecipe(id); syncLookStrip(); syncPanel(); if (hasContent) draw(); }
  function setRecipe(obj) { RECIPE = deserialiseRecipe(obj); syncLookStrip(); syncPanel(); if (hasContent) draw(); }
  function getRecipe() { return JSON.parse(serialiseRecipe(RECIPE)); }

  // Static strings (all through the lang map — §13)
  $("open-image").textContent = t("openImage");
  $("export").textContent = t("exportBtn");
  $("save-preset").textContent = t("savePreset");
  $("hero-title").textContent = t("heroTitle");
  $("hero-sub").textContent = t("heroSub");
  $("hero-open").textContent = t("heroOpen");
  $("hero-sample").textContent = t("heroSample");

  // Adjust-drawer static strings + build the panel once, synced to RECIPE.
  $("adjust").textContent = t("adjust");
  $("drawer-title").textContent = t("drawerTitle");
  $("seed-label").textContent = t("seedLabel");
  $("help").textContent = t("helpBtn");
  // a11y attribute strings through the map (locale-overridable — §13)
  $("view").setAttribute("aria-label", t("a11yPreview"));
  $("lookstrip").setAttribute("aria-label", t("a11yLooks"));
  $("drawer").setAttribute("aria-label", t("adjust"));
  $("drawer-close").setAttribute("aria-label", t("close"));
  $("seed-shuffle").setAttribute("title", t("shuffleSeed"));
  $("help").setAttribute("aria-label", t("help"));
  $("help").setAttribute("title", t("help"));

  buildLookStrip();
  buildPanel();
  syncPanel();
  $("engine-status").textContent = t("engineReady", chainCount());   // footer live before first draw

  /* ---- Before / after (B4): hold shows the untouched source ---- */
  let peeking = false;
  function drawOriginal() {
    const src = currentSource();
    const vx = view.getContext("2d");
    vx.clearRect(0, 0, view.width, view.height);
    vx.drawImage(src, 0, 0, view.width, view.height);
  }
  function peek(on) {
    if (!hasContent) return;
    if (on && !peeking) { peeking = true; drawOriginal(); }
    else if (!on && peeking) { peeking = false; draw(); }
  }
  view.addEventListener("pointerdown", (e) => { if (e.button === 0) peek(true); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) view.addEventListener(ev, () => peek(false));

  /* ---- Help + intro modals (B8) ---- */
  async function showHelp() {
    const node = document.createElement("div");
    const p = document.createElement("p"); p.textContent = t("privacyLine"); node.appendChild(p);
    const dl = document.createElement("dl");
    for (const [k, d] of t("shortcuts")) {
      const dt = document.createElement("dt"); const kbd = document.createElement("kbd"); kbd.textContent = k; dt.appendChild(kbd);
      const dd = document.createElement("dd"); dd.textContent = d;
      dl.append(dt, dd);
    }
    node.appendChild(dl);
    await openModal({ title: t("helpTitle"), node, actions: [{ label: t("close"), value: true, primary: true }], wide: true });
  }
  $("help").addEventListener("click", showHelp);

  async function maybeShowIntro() {
    if (store.get(STORE_KEYS.intro)) return;
    await openModal({ title: t("introTitle"), body: t("introBody"), actions: [{ label: t("gotIt"), value: true, primary: true }] });
    store.set(STORE_KEYS.intro, "1");
  }

  /* ---- Keyboard shortcuts (B9). Ignored while typing or a dialog is open,
     except Space (before/after) and the always-safe combos. ---- */
  const LOOK_KEYS = { "1": "sorrenti", "2": "corinne", "3": "disposable", "4": "mall", "0": "none" };
  const typingIn = (el) => el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  const modalOpen = () => !!document.querySelector(".modal-scrim");
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); if (hasContent) exportImage(); return; }
    if (typingIn(document.activeElement) || modalOpen()) return;   // Esc handled by drawer/modal owners
    if (e.key === " " && !e.repeat) { e.preventDefault(); peek(true); return; }
    if (e.key === "?" || (e.shiftKey && e.key === "/")) { e.preventDefault(); showHelp(); return; }
    if (e.key in LOOK_KEYS) { e.preventDefault(); if (hasContent) setLook(LOOK_KEYS[e.key]); return; }
  });
  document.addEventListener("keyup", (e) => { if (e.key === " ") peek(false); });

  // Topbar "Sample" cycles the fixed fixture set and switches back to sample mode.
  $("reload-sample").addEventListener("click", () => {
    sourceImage = null; variant = (variant + 1) % 6; sourceDirty = true; revealEditor(); draw(); refreshThumbs();
  });

  // M0 harness / proto agent-face handle. The determinism verifier (A10) drives
  // exactly these entry points — one pipeline, two doors (§8). setVariant forces
  // sample mode + a fresh upload so the gate's fixed image renders regardless of
  // what's loaded interactively.
  window.__muse_m0 = {
    gl, engine, view, makeSampleImage,
    redraw: draw,
    setVariant: (n) => { sourceImage = null; variant = ((n % 6) + 6) % 6; sourceDirty = true; hasContent = true; draw(); },
    getRecipe, setRecipe, setLook,
    serialiseRecipe, deserialiseRecipe, makeRecipe,
    LOOKS: LOOKS.map((l) => ({ id: l.id, name: l.name })),
    chainCount,
    // Final output — the composited visible canvas, trim included. This is
    // what the M0 determinism page hashes.
    snapshot: () => view.getContext("2d").getImageData(0, 0, view.width, view.height).data,
  };

  // i18n coverage hook for the M1 self-test: the live set of defined lang keys.
  window.__muse_i18n = { locale: LOCALE, keys: Object.keys(LANG[LOCALE] || LANG.en) };

  /* ---- Agent face (§8): window.muse, gated behind muse.dev, off by default.
     Same pipeline the UI drives — one mechanism, two doors — and the headless
     test surface for M1. applyLook renders an arbitrary source off to the side
     and restores the interactive state after. Exports mark via:"agent". ---- */
  const getLooks = () => LOOKS.map((l) => ({ id: l.id, name: l.name, params: JSON.parse(JSON.stringify(l.params || {})) }));

  async function toDrawable(source) {
    if (source instanceof Blob) return await createImageBitmap(source);
    if (typeof ImageData !== "undefined" && source instanceof ImageData) return source;   // texImage2D accepts ImageData
    if (source && source.width && (source.getContext || source.naturalWidth || source.close)) return source;   // canvas/bitmap/img
    throw new Error("applyLook: source must be a Blob, ImageData, or drawable");
  }
  async function renderToPNG(recipe) {
    const blob = await new Promise((res) => view.toBlob(res, "image/png"));
    if (!blob) throw new Error("toBlob returned null");
    const withRecipe = embedRecipePNG(new Uint8Array(await blob.arrayBuffer()), serialiseRecipe(recipe));
    return new Blob([withRecipe], { type: "image/png" });
  }
  async function applyLook(source, lookIdOrParams, opts = {}) {
    const img = await toDrawable(source);
    const rec = typeof lookIdOrParams === "string" ? makeRecipe(lookIdOrParams) : deserialiseRecipe(lookIdOrParams);
    if (opts.seed != null) rec.seed = opts.seed >>> 0;
    rec.via = "agent";
    const prev = RECIPE;                       // render off the current state, then restore
    try {
      RECIPE = rec;
      engine.render(img); compositeTrim(canvas, view);
      return await renderToPNG(rec);
    } finally {
      RECIPE = prev; sourceDirty = true; if (hasContent) draw();   // restore even if encoding throws
    }
  }
  async function agentExport(opts = {}) {
    if (!hasContent) throw new Error("muse.export: no image loaded");
    const rec = Object.assign(getRecipe(), { via: "agent" });
    if ((opts.format || "png") === "png") return renderToPNG(rec);
    // JPEG path: COM-marker embed is deferred (§12); return the frame without a recipe.
    return await new Promise((res) => view.toBlob(res, "image/jpeg", 0.92));
  }
  function installAgentFace() {
    window.muse = { getLooks, applyLook, getRecipe: () => getRecipe(), setRecipe: (j) => setRecipe(j), export: agentExport };
  }
  // Dev toggle without a reload — the self-test flips this on; off by default (§8).
  window.__museDev = (on) => {
    if (on) { store.set(STORE_KEYS.dev, "1"); installAgentFace(); }
    else { store.del(STORE_KEYS.dev); try { delete window.muse; } catch (_) { window.muse = undefined; } }
    return !!store.get(STORE_KEYS.dev);
  };
  if (store.get(STORE_KEYS.dev)) installAgentFace();

  // Expose the loaders + draw for the M1 editor layers (sliders, presets, export)
  // and the M1 self-test to drive. Kept separate from the frozen M0 face above.
  boot.editor = { loadFile, loadSample, setSource, setLook, setRecipe, getRecipe, draw,
                  toast, revealEditor, get hasContent() { return hasContent; },
                  markDirty: () => { sourceDirty = true; }, chainCount, view,
                  // Preset hooks for the M1 self-test (same code the UI drives).
                  presetAPI: {
                    save(name) { presets.push({ name, recipe: getRecipe() }); savePresets(); buildLookStrip(); syncLookStrip(); refreshThumbs(); return presets.length; },
                    list() { return presets.map((p) => p.name); },
                    apply(i) { setRecipe(presets[i].recipe); },
                    clear() { presets.length = 0; savePresets(); buildLookStrip(); syncLookStrip(); },
                  } };

  maybeShowIntro();
  gaPageview();   // one anonymous pageview; image data never touches the network
  console.log("[muse] editor up ·", chainCount(), "pass(es) · look:", RECIPE.look);
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
