<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  CSP: img-src allows blob:/data: for loaded photos and procedural fixtures. connect-src
  allows the GA collect endpoint (pageview-only, no image bytes, no PII, no persisted
  client id) PLUS the v2 reference-match vision providers (api.anthropic.com,
  api.openai.com) — reached ONLY when the user runs a BYOK match, carrying ONLY the
  user-chosen reference photo. The photo being EDITED never touches the network.
  frame-ancestors lives in _headers (Cloudflare Pages) — it is *ignored* in a <meta>
  CSP and logs a console error, so it stays header-only. file:// does not enforce any
  of this identically to https; the deployed HTTP header (_headers) is the source of truth.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://www.google-analytics.com https://api.anthropic.com https://api.openai.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="version" content="0.1.0-m1">
<meta name="description" content="Muse — take pictures of yourself like a Davide Sorrenti muse. A single-file, on-device photo tool: 19 film looks across 150 years (daguerreotype to early digital), deep sliders, recipe-in-the-file export. Your photos never leave your device.">
<meta property="og:title" content="Muse — 150 years of film looks, on-device">
<meta property="og:description" content="Drop a photo, pick a film look from any era, tune it, export. Everything runs in your browser — nothing is uploaded.">
<meta property="og:type" content="website">
<!-- Inline favicon: no favicon.ico request, no 404 in console (gate: zero errors) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0b0d'/%3E%3Ccircle cx='8' cy='8' r='4.5' fill='none' stroke='%23d8c08a' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%23d8c08a'/%3E%3C/svg%3E">
<title>Muse</title>
<style>
  :root {
    /* House palette — dark default (photo tool; chrome stays out of the image's way) */
    --bg:      #0b0b0d;
    --surface: #16161a;
    --ink:     #ececf0;
    --accent:  #d8c08a;   /* warm film-gold */
    --muted:   #8a8a93;
    --danger:  #e06a5a;
    --radius: 10px;
    --gap: 14px;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; height: 100dvh; margin: 0; }  /* dvh: no gap/clip when iOS URL bar shows/hides */
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Mobile-first, Instagram-shaped: slim app bar on top, full-bleed image, look
     strip + thumb-reachable action bar pinned to the bottom. Desktop just widens. */
  .appbar {
    display: flex; align-items: center; gap: 10px;
    padding: max(8px, env(safe-area-inset-top)) 14px 8px;
    flex: 0 0 auto;
  }
  .brand { font-weight: 600; letter-spacing: .02em; }
  .brand .dot { color: var(--accent); }
  .spacer { flex: 1 1 auto; }
  .appbar .status { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .ver { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 620px) { .appbar .status { display: none; } }   /* keep the phone bar clean */
  .stage {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;   /* belt-and-braces: never spill onto the strip/action bar */
    padding: 8px 10px;
  }
  #view {
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--radius);
    box-shadow: 0 6px 30px #0008;
    image-rendering: auto;
    background: #000;
    touch-action: none;   /* press-and-hold before/after isn't a scroll gesture */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;  /* no iOS selection/callout on hold */
  }
  /* Bottom action bar — primary reach zone. Buttons ≥44px tall (touch target). */
  .actionbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid #ffffff12;
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .actionbar .btn { min-height: 44px; flex: 0 0 auto; }
  .actionbar .icon-btn { width: 44px; height: 44px; font-size: 20px; flex: 0 0 auto; }
  .actionbar #menu-btn[aria-expanded="true"] { background: #ffffff1a; border-color: #ffffff33; }
  /* Export is the primary output — pin it to the right so it is ALWAYS visible,
     even when the bar overflows and scrolls on a narrow phone (UX-H1). */
  .actionbar #export {
    border-color: var(--accent); position: sticky; right: 0; margin-left: auto;
    background: #1c1813; box-shadow: -16px 0 14px -10px var(--bg);
  }
  /* ⋯ overflow popover — fixed, opens UPWARD from the bar's left edge. Kept OUT of
     .actionbar (which clips overflow) so it can extend above the bar. */
  .overflow-menu {
    position: fixed; left: 10px; z-index: 60;
    bottom: calc(62px + env(safe-area-inset-bottom));
    min-width: 200px; padding: 6px;
    background: #17140f; border: 1px solid #ffffff1f; border-radius: 12px;
    box-shadow: 0 10px 30px -8px #000000cc, 0 0 0 1px #0006;
    display: flex; flex-direction: column; gap: 2px;
  }
  .overflow-menu[hidden] { display: none; }
  .menu-item {
    appearance: none; text-align: left; cursor: pointer;
    background: transparent; border: 0; color: var(--ink);
    font: inherit; font-size: 15px; border-radius: 8px;
    padding: 11px 12px; min-height: 44px; width: 100%;
  }
  .menu-item:hover, .menu-item:focus-visible { background: #ffffff14; outline: none; }
  .menu-item[hidden] { display: none; }

  /* Full-viewport WebGL2-unavailable error state — no partial UI behind it. */
  .fatal {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    place-items: center;
    background: var(--bg);
    padding: 24px;
  }
  .fatal[data-show="1"] { display: grid; }
  .fatal .card {
    max-width: 520px;
    background: var(--surface);
    border: 1px solid #ffffff14;
    border-radius: var(--radius);
    padding: 28px;
  }
  .fatal h1 { margin: 0 0 10px; font-size: 18px; }
  .fatal p { color: var(--muted); margin: 0 0 12px; }
  .fatal ul { color: var(--muted); margin: 0; padding-left: 18px; }
  .hint { color: var(--muted); font-size: 12px; }
  /* One button language: same border / fill / 10px radius for actions, look pills, icons. */
  .btn {
    appearance: none; border: 1px solid #ffffff1f; background: #ffffff0d;
    color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    font: inherit; min-height: 40px;
  }
  .btn:hover { background: #ffffff16; }

  /* Look strip — bottom-pinned horizontal scroller (Instagram filter row). Live
     thumbnail previews per look; name-forward under each thumb. */
  .lookstrip {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 14px;
    flex: 0 0 auto;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    /* Hide the native scrollbar (Instagram-style filter row); fade the edges so
       "there's more →" still reads. */
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .lookstrip::-webkit-scrollbar, .actionbar::-webkit-scrollbar { display: none; }
  .lookstrip .look { scroll-snap-align: start; }
  .lookstrip .lbl { display: none; }   /* the thumbnails name themselves */
  .look {
    appearance: none; border: 1px solid #ffffff1f; background: #ffffff0d;
    color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    font: inherit; white-space: nowrap; min-height: 40px;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .look:hover { background: #ffffff16; }
  .look:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .look[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent); background: #d8c08a14;
  }
  .look:not(.has-thumb) .era { display: none; }   /* text-only pills stay uniform single-line */
  .look .thumb {
    display: none; width: 76px; height: 57px; border-radius: 6px;
    object-fit: cover; margin-bottom: 5px; background: #000;
  }
  .look.has-thumb .thumb { display: block; }
  .look.has-thumb { padding: 6px; border-radius: 10px; text-align: center; font-size: 11px; line-height: 1.2; }
  /* Let long look names (Daguerreotype, Cross-process) wrap to 2 lines, not clip (G-L6). */
  .look.has-thumb .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; }
  .look .era { display: block; font-size: 9px; color: var(--accent); opacity: .75; letter-spacing: .04em; margin-top: 1px; }
  /* Thin divider between the "Start here" cluster and the era timeline. */
  .deck-div { flex: 0 0 auto; align-self: stretch; width: 1px; margin: 8px 5px; background: #ffffff1a; }
  .preset-wrap { display: inline-flex; align-items: stretch; }
  .preset-wrap .look { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .look-del {
    appearance: none; border: 1px solid #ffffff1f; border-left: none; background: #ffffff0d;
    color: var(--muted); cursor: pointer; padding: 0 10px; font-size: 12px;
    border-radius: 0 10px 10px 0;
  }
  .look-del:hover { color: var(--danger); background: #ffffff16; }

  /* Drop-zone hero — shown until an image loads. Never a blank canvas (§4). */
  .hero {
    position: absolute; inset: var(--gap);
    display: grid; place-items: center;
    border: 2px dashed #ffffff26; border-radius: var(--radius);
    background: #ffffff05; text-align: center; padding: 24px;
    transition: border-color .15s, background .15s;
  }
  .hero.hidden { display: none; }
  .hero.drag { border-color: var(--accent); background: #d8c08a12; }
  .hero .h-inner { width: 100%; max-width: 440px; }   /* never exceed the hero on a phone (no clip) */
  .hero h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .hero .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .gallery-label { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }
  /* Sample gallery: a tidy wrapping grid — no ugly horizontal scrollbar. */
  .samples {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; width: 100%;
  }
  .sample {
    appearance: none; border: 1px solid #ffffff18; background: #ffffff08; color: var(--ink);
    border-radius: 9px; padding: 4px; cursor: pointer; font: inherit; min-width: 0;
  }
  .sample:hover { border-color: var(--accent); }
  .sample:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sample img { display: block; width: 100%; height: 58px; object-fit: cover; border-radius: 6px; background: #000; }
  .sample span { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; text-align: center; }
  .gallery-credit { margin-top: 8px; color: var(--muted); font-size: 10px; text-align: center; opacity: .7; }
  /* Discreet sibling-project footer — quiet by default, brightens on hover. */
  .sib-links { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 4px 8px; font-size: 11px; color: var(--muted); opacity: .55; }
  .sib-links #sib-label { margin-right: 2px; }
  .sib-links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; padding: 2px 0; }
  .sib-links a:hover, .sib-links a:focus-visible { color: var(--ink); border-bottom-color: #ffffff40; outline: none; }
  .sib-links .sep { opacity: .5; }
  /* ---- M2 camera surface: full-viewport overlay ---- */
  .camera { position: fixed; inset: 0; z-index: 80; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .camera[hidden] { display: none; }
  #cam-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }  /* frame source only */
  #cam-view { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
  /* Look row — a thumb-reachable scroller above the controls. */
  .cam-looks { position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
  .cam-looks::-webkit-scrollbar { display: none; }
  .cam-look { flex: 0 0 auto; appearance: none; cursor: pointer; white-space: nowrap;
    border: 1px solid #ffffff2e; background: #00000059; color: #fff; border-radius: 999px;
    padding: 8px 14px; min-height: 40px; font: inherit; font-size: 13px; backdrop-filter: blur(4px); }
  .cam-look[aria-current="true"] { border-color: var(--accent); color: var(--accent); background: #000000a6; }
  /* Controls row — ✕ · shutter · flip. */
  .cam-bar { position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-around; padding: 0 24px; }
  .cam-bar .icon-btn { width: 52px; height: 52px; font-size: 20px; background: #ffffff1f; border-color: #ffffff33; color: #fff; }
  .cam-shutter { appearance: none; cursor: pointer; width: 74px; height: 74px; border-radius: 50%;
    background: transparent; border: 4px solid #fff; padding: 0; display: grid; place-items: center; }
  .cam-shutter span { display: block; width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: transform .08s; }
  .cam-shutter:active span { transform: scale(.86); }
  /* Denied / no-device state — in-app, offers the upload fallback (no re-prompt loop). */
  .cam-error { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
    background: #000000e6; color: var(--ink); }
  .cam-error[hidden] { display: none; }
  .cam-error p { margin: 0; max-width: 340px; color: var(--muted); }
  /* ---- v2.0 reference-match modal + review bar ---- */
  .ref-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 132px; padding: 16px; text-align: center; cursor: pointer;
    border: 2px dashed #ffffff2e; border-radius: 12px; color: var(--muted); background: #ffffff05; }
  .ref-drop.drag { border-color: var(--accent); background: #d8c08a12; }
  #ref-thumb { max-width: 100%; max-height: 200px; border-radius: 8px; }
  #ref-thumb:not([hidden]) + #ref-drop-label, .ref-drop.has-ref #ref-drop-label { color: var(--ink); }
  .match-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .match-row #match-provider { flex: 0 0 auto; }
  .match-row #match-key { flex: 1 1 160px; min-width: 0; }
  .match-privacy { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.4; }
  .modal .actions .spacer { flex: 1 1 auto; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: #ffffff0d; }
  /* Review bar — pinned just above the action bar, thumb-reachable. */
  .match-review { position: fixed; left: 0; right: 0; z-index: 55;
    bottom: calc(64px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #17140fee; border-top: 1px solid #ffffff1f; backdrop-filter: blur(6px);
    overflow-x: auto; scrollbar-width: none; }
  .match-review[hidden] { display: none; }
  .match-review::-webkit-scrollbar { display: none; }
  .match-review .btn { flex: 0 0 auto; min-height: 40px; }
  .match-review-label { flex: 1 1 auto; text-align: center; font-size: 12px; color: var(--accent); white-space: nowrap; }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: #d8c08a12; }
  .btn.primary:hover { background: #d8c08a20; }

  /* Toasts — in-app only, never native alert()/confirm() (§4, handoff §12). */
  .toasts {
    /* Sit above the bottom chrome (look strip + action bar + home indicator) so a
       success toast never covers the next action (G-L1). */
    position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 65; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: max-content; max-width: 92vw;
  }
  @media (min-width: 760px) { .toasts { bottom: 24px; } }
  .toast {
    background: var(--surface); color: var(--ink);
    border: 1px solid #ffffff1f; border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; max-width: 90vw;
    box-shadow: 0 8px 24px #000a; font-size: 13px;
    animation: toast-in .18s ease-out;
  }
  .toast.err { border-left-color: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; } .hero { transition: none; }
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* In-app modal (confirm / help / intro) — replaces native alert/confirm/prompt. */
  .modal-scrim, .match-scrim {
    position: fixed; inset: 0; z-index: 70;
    display: grid; place-items: center;
    background: #000a; padding: 20px;
    animation: toast-in .15s ease-out;
  }
  /* The match scrim is a PERSISTENT element (toggled via [hidden]); it deliberately does
     NOT carry the .modal-scrim class, so modalOpen()/tests that detect a live modal by
     querySelector(".modal-scrim") never mistake this hidden element for an open dialog. */
  .match-scrim[hidden] { display: none; }
  .modal {
    background: var(--surface); color: var(--ink);
    border: 1px solid #ffffff1f; border-radius: var(--radius);
    padding: 22px; max-width: 460px; width: 100%;
    box-shadow: 0 16px 48px #000b; max-height: 86vh; overflow: auto;
  }
  .modal.wide { max-width: 560px; }
  .modal h2 { margin: 0 0 10px; font-size: 17px; }
  .modal p { margin: 0 0 12px; color: var(--muted); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .modal dt { color: var(--ink); }
  .modal dt kbd {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #ffffff12; border: 1px solid #ffffff22; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px;
  }
  .modal dd { color: var(--muted); margin: 0; align-self: center; }

  /* Adjust — bottom sheet by default (mobile-first); a right-side drawer on wide
     screens. Base is the phone shape; the media query is the desktop enhancement. */
  .stage { position: relative; }
  .drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    width: 100%; height: 74vh;
    background: var(--surface); border-top: 1px solid #ffffff16;
    border-radius: 16px 16px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .22s ease;
    box-shadow: 0 -12px 40px #0006;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .drawer.open { transform: none; }
  .drawer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #ffffff12; flex: 0 0 auto;
  }
  .drawer-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .drawer-head .seed { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 12px; }
  .drawer-head .seed input { width: 62px; }
  .icon-btn {
    appearance: none; background: #ffffff0d; border: 1px solid #ffffff20; color: var(--ink);
    border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 16px; line-height: 1;
    display: grid; place-items: center;   /* 40px touch target (G-M2/M6) */
  }
  .icon-btn:hover { background: #ffffff16; }
  .drawer-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 14px 20px; flex: 1 1 auto; }
  /* Dim scrim behind the Adjust sheet — tap-outside-to-dismiss (G-M2). */
  .drawer-scrim { position: fixed; inset: 0; z-index: 39; background: #0007; opacity: 0; transition: opacity .2s; }
  .drawer-scrim.open { opacity: 1; }
  /* Grabber handle on the mobile bottom sheet (affordance for swipe/tap-to-close). */
  .drawer::before {
    content: ""; position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 4px; border-radius: 2px; background: #ffffff33;
  }
  @media (min-width: 760px) { .drawer::before { display: none; } }
  fieldset.pass {
    border: 1px solid #ffffff14; border-radius: 9px; margin: 12px 0 0; padding: 6px 12px 12px;
  }
  fieldset.pass[data-bypassed="1"] .ctl { opacity: .4; pointer-events: none; }
  fieldset.pass legend {
    display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 12px; font-weight: 600;
  }
  fieldset.pass legend .sw { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); font-weight: 400; }
  .ctl { margin-top: 10px; }
  .ctl .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .ctl .lab .val { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ctl.rgb .triple { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ctl.rgb .triple .sub { font-size: 10px; color: var(--muted); text-align: center; }
  select.field, input.field {
    width: 100%; background: #ffffff0d; border: 1px solid #ffffff20; color: var(--ink);
    border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  /* Taller hit strip + a 22px thumb → a touch-sized target (G-H4), thin track kept. */
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #ffffff1f; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #ffffff1f; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -9px;
    border-radius: 50%; background: var(--accent); border: 3px solid #16161a;
  }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #16161a; }
  input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Basics tier — five macros at the top of the drawer, above the Advanced fold. */
  .basics { margin-bottom: 6px; }
  .basics-title { margin: 4px 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  /* Warmth / Contrast are bipolar — a centre notch marks the look's own value (0). */
  input[type=range].center { background: linear-gradient(#ffffff33, #ffffff33) no-repeat center / 2px 12px; }
  /* Advanced — the full per-pass panel, folded away by default. */
  details.advanced { margin-top: 12px; border-top: 1px solid #ffffff14; padding-top: 8px; }
  details.advanced > summary {
    cursor: pointer; list-style: none; user-select: none;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600;
    padding: 8px 2px; min-height: 24px; display: flex; align-items: center; gap: 8px;
  }
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.advanced > summary::before { content: "▸"; font-size: 10px; transition: transform .12s; }
  details.advanced[open] > summary::before { transform: rotate(90deg); }
  input.toggle { width: 16px; height: 16px; accent-color: var(--accent); }
  /* Desktop enhancement: the bottom sheet becomes a right-side drawer. */
  @media (min-width: 760px) {
    .drawer {
      top: 0; bottom: 0; right: 0; left: auto;
      width: 360px; height: 100%;
      border-top: none; border-left: 1px solid #ffffff16;
      border-radius: 0; transform: translateX(100%);
      box-shadow: -12px 0 40px #0006;
    }
    .drawer.open { transform: none; }
    /* Roomier chrome on desktop */
    .stage { padding: var(--gap); }
  }
</style>

<script>

      slope: "Slope", offset: "Offset (lift)", power: "Power (gamma)", sat: "Saturation",
      temp: "Warmth", contrast: "Contrast",
      tone: "Tone (duotone)", toneLo: "Tone — shadow", toneHi: "Tone — highlight",
      radius: "Radius", edge: "Edge bias", blend: "Blend", amount: "Amount",
      strength: "Strength", softness: "Softness", vignette: "Vignette",
      threshold: "Threshold", spread: "Spread", tint: "Tint", size: "Size",

    basicsTitle: "Basics",

      vignette: "Vignette", flash: "Flash",

    // Proper nouns still route through the map so the i18n scaffold stays honest (§13).
    lookNames: {
      none: "Original",
      daguerreotype: "Daguerreotype",
      ambrotype: "Ambrotype",
      tintype: "Tintype",
      sepia: "Sepia",
      cyanotype: "Cyanotype",
      autochrome: "Autochrome",
      technicolor: "Technicolor",
      kodachrome: "Kodachrome",
      polaroid: "Polaroid",
      eighties: "'80s Flash",
      sorrenti: "Sorrenti",
      corinne: "Corinne Day",
      disposable: "Disposable",
      mall: "Mall Studio",
      crossprocess: "Cross-process",
      digicam: "Digicam",
      lomo: "Lomo",
      phonecam: "Early Phone",
    },
    engineReady: (n) => `WebGL2 ready · ${n} pass${n === 1 ? "" : "es"} in chain`,
    version: "v0.1.0 · M1",
    fatalTitle: "WebGL2 isn't available",
    fatalBody: "Muse renders every look with a single WebGL2 shader chain — there's no fallback path by design. Your browser or device didn't provide a WebGL2 context.",

      "Use a recent Chrome, Edge, Firefox, or Safari (desktop or mobile).",
      "If you're on a virtual machine or have hardware acceleration disabled, re-enable it.",
      "On very old devices WebGL2 may simply be unsupported.",
    ],

};
let LOCALE = "en";
const t = (k, ...a) => {
  const v = (LANG[LOCALE] || LANG.en)[k];
  return typeof v === "function" ? v(...a) : v;
};

/* ---- DOM ---- */
const $ = (id) => document.getElementById(id);
const view = $("view");                            // visible output — trim compositor target
const canvas = document.createElement("canvas");   // offscreen WebGL2 chain canvas

/* ---- WebGL2 acquisition + capability gate ---- */
function getGL() {
  const opts = { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true, alpha: false };
  try {
    const gl = canvas.getContext("webgl2", opts);
    return gl || null;
  } catch (_) { return null; }
}

function showFatal() {
  $("fatal-title").textContent = t("fatalTitle");
  $("fatal-body").textContent = t("fatalBody");
  const ul = $("fatal-list");
  ul.textContent = "";
  for (const line of t("fatalList")) {
    const li = document.createElement("li");
    li.textContent = line;
    ul.appendChild(li);
  }
  $("fatal").setAttribute("data-show", "1");
}

/* ---- GL helpers ---- */
function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error("shader compile failed: " + log);
  }
  return s;
}
function program(gl, fragSrc, vertSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error("program link failed: " + log);
  }
  return p;
}

/* Attribute-less full-screen triangle: positions + UV derived from gl_VertexID.
   Draw with drawArrays(TRIANGLES, 0, 3); no VBO/VAO attributes needed. */
const VERT = `#version 300 es
out vec2 v_uv;
void main() {
  // 3-vertex triangle that covers the clip volume; uv in [0,1] over the quad.
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  v_uv = p;                       // 0,0 / 2,0 / 0,2  -> covers [0,1]^2
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

/* Identity blit — the engine's fallback when every pass is bypassed, so the
   chain writes the source to screen rather than a black frame.
   flipY corrects the CPU-uploaded source (top-left origin) into GL's bottom-left
   convention exactly once, at the entry pass — the shared convention every pass
   follows. */
const IDENTITY_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform bool u_flipY;
out vec4 o;
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  o = texture(u_src, uv);
}`;

/* =========================================================================
 * Recipe = the artifact (§6). Full param JSON + seed + version. Every pass
 * reads its slice of RECIPE.params; unimplemented passes carry their params
 * dormant (bypass:true) so the recipe SHAPE is stable from the first pass —
 * an exported recipe stays readable as later passes land.
 *
 * Colour model is ASC CDL (slope · offset · power) + saturation — the
 * industry-standard deterministic grade, no GPL lineage. "Film curve + cast"
 * is exactly what slope/offset/power express: offset lifts/crushes blacks,
 * slope tilts the cast, power bends midtones, sat mutes or pushes colour.
 * ========================================================================= */
const VERSION_ID = "0.1.0-m1";
const DEFAULT_SEED = 1;

/* Default params for the whole 8-pass chain. Only `curve` is active in A2;
   the rest are present-but-bypassed placeholders their passes will fill in. */
function defaultParams() {
  return {
    curve:      { bypass: false, slope: [1, 1, 1], offset: [0, 0, 0], power: [1, 1, 1], sat: 1,
                  temp: 0, contrast: 0,   // Basics macros: warmth + contrast, 0 = identity (looks unchanged)
                  tone: { lo: [0.16, 0.10, 0.06], hi: [0.98, 0.95, 0.86], amt: 0 } },
    defocus:    { bypass: true,  radius: 0, radial: 0, blend: 1 },
    aberration: { bypass: true,  amount: 0 },
    flash:      { bypass: true,  strength: 0, radius: 0.7, softness: 0.5, vignette: 0 },
    halation:   { bypass: true,  threshold: 0.75, strength: 0, radius: 2, tint: [1, 0.6, 0.5] },
    grain:      { bypass: true,  amount: 0, size: 1 },
    leak:       { bypass: true,  strength: 0, hue: 0, angle: 0, width: 3 },
    trim:       { bypass: true,  aspect: "none", border: 0, stamp: false, matte: false },
  };
}

/* The v1 deck (§4). A2 tunes only the curve/cast slice of each — grain, flash,
   halation etc. arrive with their passes. Chirag signs off on look quality on
   the comparison strip; these are the starting grade, not the last word. */
const LOOKS = [
  { id: "none", name: "Original", era: "", params: {} },

  // ---- Pre-colour & early colour (going back, per Chirag) ----
  { id: "daguerreotype", name: "Daguerreotype", era: "1840s", params: {
      // toned silver monochrome, hard contrast, heavy edge fall-off, cased oval
      curve: { slope: [1.12, 1.12, 1.12], offset: [-0.03, -0.03, -0.03], power: [1.18, 1.18, 1.18], sat: 0,
               tone: { lo: [0.07, 0.09, 0.13], hi: [0.91, 0.94, 0.98], amt: 1.0 } },   // cool silver
      defocus: { bypass: false, radius: 1.4, radial: 1.0, blend: 1 },
      flash: { bypass: false, strength: 0, radius: 0.6, softness: 0.4, vignette: 0.65 },
      trim: { bypass: false, aspect: "4:3", border: 0.02, stamp: false, matte: true } } },
  { id: "ambrotype", name: "Ambrotype", era: "1850s", params: {
      // dark warm glass plate — deeper & warmer than the daguerreotype's cool silver
      curve: { slope: [1.1, 1.1, 1.1], offset: [-0.05, -0.05, -0.05], power: [1.22, 1.22, 1.22], sat: 0,
               tone: { lo: [0.05, 0.05, 0.06], hi: [0.82, 0.79, 0.72], amt: 1.0 } },   // dim warm silver
      defocus: { bypass: false, radius: 1.2, radial: 0.9, blend: 0.9 },
      flash: { bypass: false, strength: 0, radius: 0.6, softness: 0.4, vignette: 0.72 },
      trim: { bypass: false, aspect: "4:3", border: 0.02, stamp: false, matte: true } } },
  { id: "tintype", name: "Tintype", era: "1860s", params: {

/* "Start here" cluster (G-H3): the brand/hero looks a newcomer wants first, pinned to
   the front of the deck so they aren't buried in the chronological timeline. The rest of
   LOOKS follows in era order behind a divider. */
const FEATURED = ["none", "sorrenti", "corinne", "disposable", "mall", "polaroid"];

/* Deep-merge preset overrides onto defaults. Arrays (vec3s) replace wholesale —
   a preset gives a complete offset triple, never a partial one. */
function deepMerge(base, over) {
  if (Array.isArray(base) || Array.isArray(over)) return over === undefined ? base : over.slice();
  if (base && typeof base === "object" && over && typeof over === "object") {
    const out = {};
    for (const k of Object.keys(base)) out[k] = deepMerge(base[k], over[k]);
    for (const k of Object.keys(over)) if (!(k in out)) out[k] = over[k];
    return out;
  }
  return over === undefined ? base : over;
}

function makeRecipe(lookId) {
  const look = LOOKS.find((l) => l.id === lookId) || LOOKS[0];
  return { v: VERSION_ID, look: look.id, seed: DEFAULT_SEED, params: deepMerge(defaultParams(), look.params || {}) };
}

/* Canonical, byte-stable stringify: keys sorted recursively so
   serialise(deserialise(x)) === serialise(x) regardless of input key order.
   This is the round-trip the M0 determinism gate checks. */
function stableStringify(v) {
  if (Array.isArray(v)) return "[" + v.map(stableStringify).join(",") + "]";
  if (v && typeof v === "object") {
    return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stableStringify(v[k])).join(",") + "}";
  }
  return JSON.stringify(v);
}
const serialiseRecipe = (r) => stableStringify(r);

/* Normalise any recipe-shaped input into the current full shape: unknown keys
   dropped, missing keys defaulted. Makes restore robust and output canonical. */
function deserialiseRecipe(input) {
  const o = typeof input === "string" ? JSON.parse(input) : (input || {});
  return {
    v: typeof o.v === "string" ? o.v : VERSION_ID,
    look: typeof o.look === "string" ? o.look : "none",
    seed: Number.isFinite(o.seed) ? o.seed : DEFAULT_SEED,
    params: deepMerge(defaultParams(), o.params || {}),
  };
}

/* Current edit state. Set at boot; every render reads from it. */
let RECIPE = makeRecipe("sorrenti");

/* Film curve + cast (pass 1). ASC CDL + saturation, flipY at the entry pass. */
const CURVE_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform bool u_flipY;
uniform vec3 u_slope;
uniform vec3 u_offset;
uniform vec3 u_power;
uniform float u_sat;
uniform float u_temp;     // Basics: warmth, 0 = identity (guarded); + warms, − cools
uniform float u_contrast; // Basics: contrast about 0.5, 0 = identity (guarded)
uniform vec3 u_toneLo;   // duotone shadow tint
uniform vec3 u_toneHi;   // duotone highlight tint
uniform float u_toneAmt; // 0 = off (identity); >0 blends the luma→lo..hi ramp
out vec4 o;
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec4 src = texture(u_src, uv);
  vec3 c = src.rgb;
  // ASC CDL: out = (in * slope + offset)^power, clamped so pow() never sees < 0.
  c = clamp(c * u_slope + u_offset, 0.0, 1.0);
  c = pow(c, u_power);
  // Saturation about Rec.709 luma.
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = clamp(mix(vec3(l), c, u_sat), 0.0, 1.0);
  // Basics macros — both guarded on exact 0.0 so every stock look is byte-identical.
  if (u_temp != 0.0)     { c = clamp(c + vec3(u_temp, 0.0, -u_temp) * 0.12, 0.0, 1.0); }        // warmth: R up / B down
  if (u_contrast != 0.0) { c = clamp((c - 0.5) * (1.0 + u_contrast * 0.6) + 0.5, 0.0, 1.0); }   // contrast about mid-grey
  // Duotone toning — split-tone / sepia / silver for the pre-colour eras. Maps the
  // (possibly desaturated) luminance onto a shadow→highlight tint ramp, blended by
  // amount. Guarded on exact 0.0 (like temp/contrast) so every amt==0 look is
  // byte-identical on any GPU, not just where mix(c,duo,0) happens to be bit-exact.
  if (u_toneAmt != 0.0) {
    float lt = dot(c, vec3(0.2126, 0.7152, 0.0722));
    vec3 duo = mix(u_toneLo, u_toneHi, lt);
    c = clamp(mix(c, duo, u_toneAmt), 0.0, 1.0);
  }
  o = vec4(c, src.a);
}`;

/* Defocus (pass 2). Fixed 13-tap disc kernel (centre + two hexagonal rings,
   hardcoded offsets — deterministic, no runtime trig). `radial` weights the
   blur toward the frame edge (0 = uniform soft focus, 1 = edge-only, the
   plastic-lens read); `blend` mixes blurred over sharp for the diffusion look.
   Radius is in source pixels. Radial distance is flip-symmetric, so the
   pre-flip v_uv is safe for the weighting. */
const DEFOCUS_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform bool u_flipY;
uniform float u_radius;
uniform float u_radial;
uniform float u_blend;
out vec4 o;
const vec2 TAPS[12] = vec2[](
  vec2( 0.5,    0.0  ), vec2( 0.25,  0.433), vec2(-0.25,  0.433),
  vec2(-0.5,    0.0  ), vec2(-0.25, -0.433), vec2( 0.25, -0.433),
  vec2( 0.866,  0.5  ), vec2( 0.0,   1.0  ), vec2(-0.866,  0.5 ),
  vec2(-0.866, -0.5  ), vec2( 0.0,  -1.0  ), vec2( 0.866, -0.5 )
);
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec4 sharp = texture(u_src, uv);
  vec2 p = (v_uv - 0.5) * vec2(u_res.x / u_res.y, 1.0);
  float d = length(p) * 2.0;
  float w = mix(1.0, smoothstep(0.2, 1.0, d), u_radial);
  float r = u_radius * w;
  vec3 acc = sharp.rgb;
  float wsum = 1.0;
  for (int i = 0; i < 12; i++) {
    float tw = i < 6 ? 0.85 : 0.55;   // inner ring vs outer ring weight
    acc += texture(u_src, uv + TAPS[i] * r / u_res).rgb * tw;
    wsum += tw;
  }
  o = vec4(mix(sharp.rgb, acc / wsum, u_blend), sharp.a);
}`;

/* Chromatic aberration (pass 3). Radial R/B split: R sampled outward, B inward,
   growing from zero at centre. `amount` = fringe width in pixels at mid-edge.
   Radially symmetric, so flip-invariant like defocus. */
const CA_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform bool u_flipY;
uniform float u_amount;
out vec4 o;
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec2 dir = uv - 0.5;
  vec2 off = dir * (2.0 * u_amount) / u_res;
  float r = texture(u_src, uv + off).r;
  vec4 g = texture(u_src, uv);
  float b = texture(u_src, uv - off).b;
  o = vec4(r, g.g, b, g.a);
}`;

/* Flash falloff + vignette (pass 4). Aspect-corrected radial distance
   (d: 0 centre → 1 mid-height edge). Flash lifts inside `radius` with a
   `softness`-scaled shoulder — clipping past white is the point (blown flash
   zone); vignette pulls the far field down toward the corners. */
const FLASH_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform bool u_flipY;
uniform float u_strength;
uniform float u_radius;
uniform float u_softness;
uniform float u_vignette;
out vec4 o;
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec4 src = texture(u_src, uv);
  vec2 p = (v_uv - 0.5) * vec2(u_res.x / u_res.y, 1.0);
  float d = length(p) * 2.0;
  float lo = u_radius * max(1.0 - u_softness, 0.0);
  float hi = u_radius * (1.0 + u_softness) + 1e-4;
  float flash = 1.0 + u_strength * (1.0 - smoothstep(lo, hi, d));
  float vig = 1.0 - u_vignette * smoothstep(0.5, 1.5, d);
  o = vec4(clamp(src.rgb * flash * vig, 0.0, 1.0), src.a);
}`;

/* Halation (pass 5): threshold → blurH → blurV → screen, per §5. A multi-step
   pass — the engine keeps the pass input alive as `u_base` while the glow is
   extracted and blurred, then the composite screens the tinted glow over it.
   Step shaders sample v_uv directly (never flipped): the engine guarantees a
   multi-step pass is never the chain entry by prepending the identity blit. */
const HAL_THRESH_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform float u_threshold;
out vec4 o;
void main() {
  vec3 c = texture(u_src, v_uv).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float k = smoothstep(u_threshold, 1.0, l);   // soft knee, no hard clip line
  o = vec4(c * k, 1.0);
}`;

/* Separable 9-tap normalised Gaussian (weights are the standard discrete
   Gaussian samples). `u_spread` scales tap spacing in px — wider glow without
   more taps; deterministic. */
const HAL_BLUR_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform vec2 u_dir;
uniform float u_spread;
out vec4 o;
void main() {
  vec2 s = u_dir * u_spread / u_res;
  vec3 acc = texture(u_src, v_uv).rgb * 0.227027;
  acc += (texture(u_src, v_uv + s      ).rgb + texture(u_src, v_uv - s      ).rgb) * 0.1945946;
  acc += (texture(u_src, v_uv + s * 2.0).rgb + texture(u_src, v_uv - s * 2.0).rgb) * 0.1216216;
  acc += (texture(u_src, v_uv + s * 3.0).rgb + texture(u_src, v_uv - s * 3.0).rgb) * 0.054054;
  acc += (texture(u_src, v_uv + s * 4.0).rgb + texture(u_src, v_uv - s * 4.0).rgb) * 0.016216;
  o = vec4(acc, 1.0);
}`;

const HAL_COMP_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_src;    /* blurred highlights */
uniform sampler2D u_base;   /* pass input */
uniform vec2 u_res;
uniform float u_strength;
uniform vec3 u_tint;
out vec4 o;
void main() {
  vec4 base = texture(u_base, v_uv);
  vec3 glow = clamp(texture(u_src, v_uv).rgb * u_tint * u_strength, 0.0, 1.0);
  o = vec4(1.0 - (1.0 - base.rgb) * (1.0 - glow), base.a);   /* screen blend */
}`;

/* Grain (pass 6) — the seeded pass. PCG hash on integer cell coords + seed:
   highp uint ops are bit-exact, so same params + same seed + same image =
   identical pixels — the M0 determinism contract, with no reliance on GPU
   trig precision. Luminance-weighted (peaks in midtones, floored so extremes
   still carry some), mono, additive; `size` scales cell chunkiness. */
const GRAIN_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform bool u_flipY;
uniform float u_amount;
uniform float u_size;
uniform uint u_seed;
out vec4 o;
uint pcg(uint v) {
  uint state = v * 747796405u + 2891336453u;
  uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
  return (word >> 22u) ^ word;
}
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec4 src = texture(u_src, uv);
  vec3 c = src.rgb;
  uvec2 cell = uvec2(floor(gl_FragCoord.xy / max(u_size, 1.0)));
  uint h = pcg(cell.x ^ pcg(cell.y ^ u_seed));
  float n = float(h) * (1.0 / 4294967295.0) - 0.5;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float w = mix(0.35, 1.0, 4.0 * l * (1.0 - l));
  o = vec4(clamp(c + n * u_amount * w, 0.0, 1.0), src.a);
}`;

/* Light leak (pass 7, optional — no base look ships one; it's a slider at M1).
   A soft glow entering from off-frame: `angle` picks the entry direction
   (radians, 0 = right edge, counter-clockwise, y-up), the seed jitters the
   entry point and reach, `hue` colours it, `width` sets the falloff, and it
   screens over the frame. Position uses v_uv (output space) like flash —
   only texture reads flip. */
const LEAK_FRAG = `#version 300 es
precision highp float;
precision highp int;
in vec2 v_uv;
uniform sampler2D u_src;
uniform vec2 u_res;
uniform bool u_flipY;
uniform float u_strength;
uniform float u_hue;
uniform float u_angle;
uniform float u_width;
uniform uint u_seed;
out vec4 o;
uint pcg(uint v) {
  uint state = v * 747796405u + 2891336453u;
  uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
  return (word >> 22u) ^ word;
}
float srand(uint s, uint k) { return float(pcg(s ^ (k * 2654435769u))) * (1.0 / 4294967295.0); }
vec3 hue2rgb(float h) {
  vec3 k = mod(vec3(5.0, 3.0, 1.0) + h * 6.0, 6.0);
  return 1.0 - clamp(min(k, 4.0 - k), 0.0, 1.0);
}
void main() {
  vec2 uv = u_flipY ? vec2(v_uv.x, 1.0 - v_uv.y) : v_uv;
  vec4 src = texture(u_src, uv);
  vec2 p = (v_uv - 0.5) * vec2(u_res.x / u_res.y, 1.0) * 2.0;
  float ja = (srand(u_seed, 1u) - 0.5) * 0.6;
  float jr = 0.9 + (srand(u_seed, 2u) - 0.5) * 0.3;
  vec2 P = vec2(cos(u_angle + ja), sin(u_angle + ja)) * jr;
  float d = length(p - P);
  vec3 leak = clamp(hue2rgb(u_hue) * exp(-d * d * u_width) * u_strength, 0.0, 1.0);
  o = vec4(1.0 - (1.0 - src.rgb) * (1.0 - leak), src.a);   /* screen blend */
}`;

/* ---- Pass registry (ordered per §5: curve → defocus → CA → flash → halation
   → grain → leak; trim (pass 8) is a Canvas2D compositor, not a fragment pass).
   `paramKey` binds a pass to its slice of RECIPE.params and drives per-pass
   bypass. A pass is either { frag, uniforms } (one draw) or { steps: [...] }
   (a sub-chain; a step with useBase:true additionally reads the pass input). ---- */
const PASSES = [
  {
    id: "curve",
    name: "Film curve + cast",
    paramKey: "curve",
    frag: CURVE_FRAG,
    uniforms(gl, uloc) {
      const p = RECIPE.params.curve;
      gl.uniform3f(uloc("u_slope"), p.slope[0], p.slope[1], p.slope[2]);
      gl.uniform3f(uloc("u_offset"), p.offset[0], p.offset[1], p.offset[2]);
      gl.uniform3f(uloc("u_power"), p.power[0], p.power[1], p.power[2]);
      gl.uniform1f(uloc("u_sat"), p.sat);
      gl.uniform1f(uloc("u_temp"), p.temp || 0);
      gl.uniform1f(uloc("u_contrast"), p.contrast || 0);
      const tn = p.tone || { lo: [0, 0, 0], hi: [1, 1, 1], amt: 0 };
      gl.uniform3f(uloc("u_toneLo"), tn.lo[0], tn.lo[1], tn.lo[2]);
      gl.uniform3f(uloc("u_toneHi"), tn.hi[0], tn.hi[1], tn.hi[2]);
      gl.uniform1f(uloc("u_toneAmt"), tn.amt);
    },
  },
  {
    id: "defocus",
    name: "Defocus",
    paramKey: "defocus",
    frag: DEFOCUS_FRAG,
    uniforms(gl, uloc) {
      const p = RECIPE.params.defocus;
      gl.uniform1f(uloc("u_radius"), p.radius);
      gl.uniform1f(uloc("u_radial"), p.radial);
      gl.uniform1f(uloc("u_blend"), p.blend);
    },
  },
  {
    id: "aberration",
    name: "Chromatic aberration",
    paramKey: "aberration",
    frag: CA_FRAG,
    uniforms(gl, uloc) {
      gl.uniform1f(uloc("u_amount"), RECIPE.params.aberration.amount);
    },
  },
  {
    id: "flash",
    name: "Flash + vignette",
    paramKey: "flash",
    frag: FLASH_FRAG,
    uniforms(gl, uloc) {
      const p = RECIPE.params.flash;
      gl.uniform1f(uloc("u_strength"), p.strength);
      gl.uniform1f(uloc("u_radius"), p.radius);
      gl.uniform1f(uloc("u_softness"), p.softness);
      gl.uniform1f(uloc("u_vignette"), p.vignette);
    },
  },
  {
    id: "halation",
    name: "Halation",
    paramKey: "halation",
    steps: [
      { frag: HAL_THRESH_FRAG, uniforms(gl, uloc) {
          gl.uniform1f(uloc("u_threshold"), RECIPE.params.halation.threshold);
        } },
      { frag: HAL_BLUR_FRAG, uniforms(gl, uloc) {
          gl.uniform2f(uloc("u_dir"), 1, 0);
          gl.uniform1f(uloc("u_spread"), RECIPE.params.halation.radius);
        } },
      { frag: HAL_BLUR_FRAG, uniforms(gl, uloc) {
          gl.uniform2f(uloc("u_dir"), 0, 1);
          gl.uniform1f(uloc("u_spread"), RECIPE.params.halation.radius);
        } },
      { frag: HAL_COMP_FRAG, useBase: true, uniforms(gl, uloc) {
          const p = RECIPE.params.halation;
          gl.uniform1f(uloc("u_strength"), p.strength);
          gl.uniform3f(uloc("u_tint"), p.tint[0], p.tint[1], p.tint[2]);
        } },
    ],
  },
  {
    id: "grain",
    name: "Grain",
    paramKey: "grain",
    frag: GRAIN_FRAG,
    uniforms(gl, uloc) {
      const p = RECIPE.params.grain;
      gl.uniform1f(uloc("u_amount"), p.amount);
      gl.uniform1f(uloc("u_size"), p.size);
      gl.uniform1ui(uloc("u_seed"), RECIPE.seed >>> 0);
    },
  },
  {
    id: "leak",
    name: "Light leak",
    paramKey: "leak",
    frag: LEAK_FRAG,
    uniforms(gl, uloc) {
      const p = RECIPE.params.leak;
      gl.uniform1f(uloc("u_strength"), p.strength);
      gl.uniform1f(uloc("u_hue"), p.hue);
      gl.uniform1f(uloc("u_angle"), p.angle);
      gl.uniform1f(uloc("u_width"), p.width);
      gl.uniform1ui(uloc("u_seed"), RECIPE.seed >>> 0);
    },
  },
];

/* =========================================================================
 * Trim (pass 8) — Canvas2D compositor per §5: centre-crop to aspect, white
 * border, date stamp, optional oval matte. Integer geometry throughout so
 * composited pixels are deterministic; the visible canvas IS this
 * compositor's output and the harness hashes it (getImageData), trim
 * included. When trim is bypassed it's a 1:1 blit of the GL result.
 * ========================================================================= */
const ASPECTS = { "4:3": [4, 3], "3:2": [3, 2], "1:1": [1, 1] };

/* Seven-segment date stamp drawn from rects, not fillText: no font
   dependency, deterministic pixels, locale-independent (§13 — the date is a
   prop, not a date). Classic orange quartz-back, fixed prop string. */
const STAMP_TEXT = "'98 4 12";
const STAMP_SEGS = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fbgc",
                     "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abfgcd" };
function drawStamp(x, ix, iy, iw, ih) {
  const u = Math.max(2, Math.round(Math.min(iw, ih) * 0.007));  // segment thickness
  const dw = u * 4, dh = u * 7, hseg = Math.round((dh - 3 * u) / 2);
  const widths = [...STAMP_TEXT].map((ch) => ch === " " ? Math.round(dw * 0.6) : ch === "'" ? Math.round(dw * 0.4) : dw);
  const total = widths.reduce((a, w) => a + w + u, -u);
  let px = ix + iw - total - u * 6;
  const py = iy + ih - dh - u * 6;
  x.fillStyle = "#ff9a2a";
  for (let i = 0; i < STAMP_TEXT.length; i++) {
    const ch = STAMP_TEXT[i];
    if (ch === "'") {
      x.fillRect(px, py, u, u * 2);
    } else if (ch !== " ") {
      for (const s of STAMP_SEGS[ch]) {
        if (s === "a") x.fillRect(px + u, py, dw - 2 * u, u);
        if (s === "g") x.fillRect(px + u, py + u + hseg, dw - 2 * u, u);
        if (s === "d") x.fillRect(px + u, py + dh - u, dw - 2 * u, u);
        if (s === "f") x.fillRect(px, py + u, u, hseg);
        if (s === "b") x.fillRect(px + dw - u, py + u, u, hseg);
        if (s === "e") x.fillRect(px, py + 2 * u + hseg, u, hseg);
        if (s === "c") x.fillRect(px + dw - u, py + 2 * u + hseg, u, hseg);
      }
    }
    px += widths[i] + u;
  }
}

function drawMatte(x, W, H) {
  x.fillStyle = "#efe9dc";
  x.beginPath();
  x.rect(0, 0, W, H);
  x.ellipse(W / 2, H / 2, W * 0.44, H * 0.46, 0, 0, Math.PI * 2);
  x.fill("evenodd");
}

function compositeTrim(glCanvas, out) {
  const p = RECIPE.params.trim;
  const gw = glCanvas.width, gh = glCanvas.height;
  let sw = gw, sh = gh;
  const asp = !p.bypass && ASPECTS[p.aspect];
  if (asp) {
    if (gw * asp[1] > gh * asp[0]) sw = Math.floor(gh * asp[0] / asp[1]);
    else sh = Math.floor(gw * asp[1] / asp[0]);
  }
  const sx = Math.floor((gw - sw) / 2), sy = Math.floor((gh - sh) / 2);
  const b = !p.bypass && p.border > 0 ? Math.round(Math.min(sw, sh) * p.border) : 0;
  out.width = sw + 2 * b; out.height = sh + 2 * b;   // resizing also clears
  const x = out.getContext("2d");
  if (b) { x.fillStyle = "#f6f3ec"; x.fillRect(0, 0, out.width, out.height); }
  x.drawImage(glCanvas, sx, sy, sw, sh, b, b, sw, sh);
  if (!p.bypass && p.matte) drawMatte(x, out.width, out.height);
  if (!p.bypass && p.stamp) drawStamp(x, b, b, sw, sh);
}

/* ---- Engine: compiles passes, manages ping-pong FBOs, renders the chain ---- */
function makeEngine(gl) {
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); // we flip in-shader at the entry pass

  // Compile every registered pass once, with a per-program uniform-location cache
  // so hot draws don't re-query the driver. `uloc(name)` memoises getUniformLocation.
  function compileEntry(def, frag) {
    const prog = program(gl, frag, VERT);
    const cache = new Map();
    const uloc = (name) => {
      if (!cache.has(name)) cache.set(name, gl.getUniformLocation(prog, name));
      return cache.get(name);
    };
    return { def, prog, uloc };
  }
  // A multi-step pass compiles each step; the pass-level entry carries them.
  const compiled = PASSES.map((p) =>
    p.steps ? { def: p, steps: p.steps.map((s) => compileEntry(s, s.frag)) }
            : compileEntry(p, p.frag));
  // Identity blit — runs when every pass is bypassed (never a black frame), and
  // as the forced chain entry when the first active pass is multi-step, so step
  // shaders never deal with source orientation.
  const blit = compileEntry({ id: "__blit", uniforms: null }, IDENTITY_FRAG);

  // Source texture (the loaded/procedural image).
  const srcTex = gl.createTexture();
  function setNPOT(tex) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  }

  // Pool of three scratch targets (RGBA8). Simple passes ping between two; a
  // multi-step pass additionally needs its input (`base`) alive while the glow
  // is blurred — three covers read + write + base at any moment.
  let W = 0, H = 0;
  const targets = [makeTarget(), makeTarget(), makeTarget()];
  function makeTarget() {
    const tex = gl.createTexture();
    const fbo = gl.createFramebuffer();
    return { tex, fbo };
  }
  function sizeTargets(w, h) {
    if (w === W && h === H) return;
    W = w; H = h;
    for (const tgt of targets) {
      gl.bindTexture(gl.TEXTURE_2D, tgt.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      setNPOT(tgt.tex);
      gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tgt.tex, 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function uploadSource(image) {
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, image);
    setNPOT(srcTex);
    return { w: image.width, h: image.height };
  }

  const vao = gl.createVertexArray(); // empty VAO required to draw in WebGL2 core

  // Which passes run this frame: registered order, minus any whose param slice
  // is bypassed. Empty → the identity blit, so the frame is never black.
  function activePasses() {
    const on = compiled.filter((c) => {
      const p = RECIPE.params[c.def.paramKey];
      return !(p && p.bypass);
    });
    return on.length ? on : [blit];
  }

  // Run the chain. If image given, (re)upload it. Renders final to the default
  // framebuffer (screen); with preserveDrawingBuffer we can snapshot() after.
  function render(image) {
    if (image) {
      const dim = uploadSource(image);
      if (canvas.width !== dim.w || canvas.height !== dim.h) {
        canvas.width = dim.w; canvas.height = dim.h;
      }
      sizeTargets(dim.w, dim.h);
    }
    let active = activePasses();
    // A multi-step entry pass would have to orientation-correct both its main
    // read and its base read; normalising through the blit keeps step shaders
    // flip-free instead.
    if (active[0].def.steps) active = [blit, ...active];

    gl.bindVertexArray(vao);
    gl.activeTexture(gl.TEXTURE0);

    // Pool allocation: pick a scratch target not currently being read.
    const pick = (...used) => {
      for (let k = 0; k < targets.length; k++) if (!used.includes(k)) return k;
    };
    const bindDst = (idx) => {
      if (idx === -1) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets[idx].fbo);
        gl.viewport(0, 0, W, H);
      }
    };
    const drawOne = (entry, srcTexture, extra) => {
      gl.useProgram(entry.prog);
      gl.bindTexture(gl.TEXTURE_2D, srcTexture);
      gl.uniform1i(entry.uloc("u_src"), 0);
      gl.uniform2f(entry.uloc("u_res"), W, H);
      extra && extra(entry);
      entry.def.uniforms && entry.def.uniforms(gl, entry.uloc);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    let readTex = srcTex, readIdx = -1;   // -1: srcTex / the screen
    for (let i = 0; i < active.length; i++) {
      const c = active[i];
      const first = i === 0, last = i === active.length - 1;

      if (c.def.steps) {
        // Multi-step pass: keep the pass input (base) alive for useBase steps.
        const baseTex = readTex, baseIdx = readIdx;
        for (let j = 0; j < c.steps.length; j++) {
          const st = c.steps[j];
          const final = last && j === c.steps.length - 1;
          const dstIdx = final ? -1 : pick(baseIdx, readIdx);
          bindDst(dstIdx);
          drawOne(st, readTex, (entry) => {
            if (entry.def.useBase) {
              gl.activeTexture(gl.TEXTURE1);
              gl.bindTexture(gl.TEXTURE_2D, baseTex);
              gl.uniform1i(entry.uloc("u_base"), 1);
              gl.activeTexture(gl.TEXTURE0);
            }
          });
          if (!final) { readTex = targets[dstIdx].tex; readIdx = dstIdx; }
        }
      } else {
        const dstIdx = last ? -1 : pick(readIdx);
        bindDst(dstIdx);
        // Only the entry pass reads srcTex (top-left origin) and flips;
        // downstream passes read FBOs already in display orientation.
        // Null-location-safe on programs without the uniform.
        drawOne(c, readTex, (entry) => gl.uniform1i(entry.uloc("u_flipY"), first ? 1 : 0));
        if (!last) { readTex = targets[dstIdx].tex; readIdx = dstIdx; }
      }
    }
    gl.bindVertexArray(null);
  }

  // Read the rendered frame back (RGBA8, row-major from the GL bottom-left origin).
  // The determinism gate hashes this; orientation is irrelevant as long as it's stable.
  function snapshot() {
    const px = new Uint8Array(canvas.width * canvas.height * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return px;
  }

  return { render, snapshot, activeCount: () => activePasses().length };
}

/* ---- Procedural test fixture (A1): a face-ish subject with skin midtones,
   a bright window (halation/flash target), shadow, and neutral patches.
   Drawn on a 2D canvas so the harness renders with zero external assets and
   honors the CSP. Deterministic — no Math.random. ---- */
function makeSampleImage(w, h, variant) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");

  // background wash — cool daylight vs warm interior by variant
  const warm = variant % 2 === 0;
  const g = x.createLinearGradient(0, 0, 0, h);
  if (warm) { g.addColorStop(0, "#3a2f28"); g.addColorStop(1, "#141013"); }
  else      { g.addColorStop(0, "#2c343b"); g.addColorStop(1, "#0f1418"); }
  x.fillStyle = g; x.fillRect(0, 0, w, h);

  // bright window / light source — a hot region for flash + halation to grab
  const wx = warm ? w * 0.72 : w * 0.2;
  const wg = x.createRadialGradient(wx, h * 0.28, 8, wx, h * 0.28, w * 0.35);
  wg.addColorStop(0, "#fffdf6"); wg.addColorStop(0.5, "#fff4d8cc"); wg.addColorStop(1, "#fff4d800");
  x.fillStyle = wg; x.fillRect(0, 0, w, h);

  // subject: head + shoulders silhouette with skin gradient
  const cx = w * 0.5, cy = h * 0.58, rr = Math.min(w, h) * 0.22;
  const skin = x.createRadialGradient(cx - rr * 0.3, cy - rr * 0.4, rr * 0.2, cx, cy, rr * 1.2);
  const tone = variant % 3; // vary skin tone across the fixed set
  const tones = [["#f0c9a8", "#7a4b34"], ["#c98f66", "#5a3320"], ["#8a5a3c", "#3a2114"]];
  skin.addColorStop(0, tones[tone][0]); skin.addColorStop(1, tones[tone][1]);
  x.fillStyle = skin;
  x.beginPath(); x.ellipse(cx, cy, rr, rr * 1.15, 0, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(cx, cy + rr * 1.5, rr * 1.8, rr * 1.1, 0, 0, Math.PI); x.fill();

  // eyes/mouth hints — a little structure for defocus/CA to act on
  x.fillStyle = "#20140e";
  x.beginPath(); x.ellipse(cx - rr * 0.4, cy - rr * 0.1, rr * 0.09, rr * 0.06, 0, 0, 7); x.fill();
  x.beginPath(); x.ellipse(cx + rr * 0.4, cy - rr * 0.1, rr * 0.09, rr * 0.06, 0, 0, 7); x.fill();
  x.strokeStyle = "#3a201a"; x.lineWidth = Math.max(2, rr * 0.03);
  x.beginPath(); x.arc(cx, cy + rr * 0.35, rr * 0.35, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();

  // neutral + saturated patches bottom strip — reference for curve/cast reads
  const patches = ["#ffffff", "#808080", "#000000", "#c02b2b", "#2bc04a", "#2b5cc0"];
  const pw = w / patches.length;
  for (let i = 0; i < patches.length; i++) {
    x.fillStyle = patches[i];
    x.fillRect(i * pw, h - h * 0.06, pw, h * 0.06);
  }
  return c;
}

/* =========================================================================
 * In-app modal — replaces native alert/confirm/prompt (handoff §12). Focus-
 * trapped, Esc/scrim-dismiss, restores focus to the opener. Returns a promise
 * that resolves with the chosen action's value (or null on dismiss).
 * ========================================================================= */
function openModal({ title, body, node, actions, wide, dismissValue = null }) {
  return new Promise((resolve) => {
    const opener = document.activeElement;
    const scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    const modal = document.createElement("div");
    modal.className = "modal" + (wide ? " wide" : "");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    if (title) {
      const h = document.createElement("h2");
      h.id = "modal-title-" + Math.floor(performance.now());
      h.textContent = title;
      modal.setAttribute("aria-labelledby", h.id);
      modal.appendChild(h);
    }
    if (node) modal.appendChild(node);
    else if (body) { const p = document.createElement("p"); p.textContent = body; modal.appendChild(p); }

    const bar = document.createElement("div");
    bar.className = "actions";
    let done = false;
    const finish = (val) => { if (done) return; done = true; document.removeEventListener("keydown", onKey, true); scrim.remove(); if (opener && opener.focus) opener.focus(); resolve(val); };
    for (const a of (actions || [{ label: "OK", value: true, primary: true }])) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn" + (a.primary ? " primary" : "");
      b.textContent = a.label;
      b.addEventListener("click", () => finish(a.value));
      bar.appendChild(b);
    }
    modal.appendChild(bar);
    scrim.appendChild(modal);
    scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) finish(dismissValue); });

    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); finish(dismissValue); return; }
      if (e.key === "Tab") {
        const f = modal.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(scrim);
    const focusFirst = bar.querySelector(".primary") || bar.querySelector("button");
    focusFirst && focusFirst.focus();
  });
}

/* =========================================================================
 * Recipe embed = the artifact (§6). PNG tEXt chunk, keyword "muse", no EXIF
 * library (§12). CRC-32 is the standard PNG polynomial. The chunk is inserted
 * immediately before IEND; reading walks the chunk list for keyword "muse".
 * ========================================================================= */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
const RECIPE_KEYWORD = "muse";
// tEXt is Latin-1; our recipe JSON is ASCII (numeric params, ASCII keys), so a
// byte-per-char encoding round-trips exactly.
function latin1Bytes(str) { const u = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) u[i] = str.charCodeAt(i) & 0xff; return u; }
function latin1Str(bytes) { let s = ""; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return s; }

function embedRecipePNG(png, recipeStr) {
  const type = latin1Bytes("tEXt");
  const data = latin1Bytes(RECIPE_KEYWORD + "\0" + recipeStr);
  const chunk = new Uint8Array(12 + data.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(type, 4);
  chunk.set(data, 8);
  const crcIn = new Uint8Array(4 + data.length); crcIn.set(type, 0); crcIn.set(data, 4);
  dv.setUint32(8 + data.length, crc32(crcIn));
  // IEND is the final 12 bytes of a valid PNG; splice the tEXt chunk before it.
  const iendPos = png.length - 12;
  const out = new Uint8Array(png.length + chunk.length);
  out.set(png.subarray(0, iendPos), 0);
  out.set(chunk, iendPos);
  out.set(png.subarray(iendPos), iendPos + chunk.length);
  return out;
}
function readRecipePNG(png) {
  if (png.length < 8 || png[0] !== 0x89 || png[1] !== 0x50 || png[2] !== 0x4e || png[3] !== 0x47) return null;
  const dv = new DataView(png.buffer, png.byteOffset, png.byteLength);
  let p = 8;
  while (p + 8 <= png.length) {
    const len = dv.getUint32(p);
    const type = latin1Str(png.subarray(p + 4, p + 8));
    const dataStart = p + 8;
    if (type === "tEXt") {
      const data = png.subarray(dataStart, dataStart + len);
      const z = data.indexOf(0);
      if (z >= 0 && latin1Str(data.subarray(0, z)) === RECIPE_KEYWORD) {
        return latin1Str(data.subarray(z + 1));
      }
    }
    if (type === "IEND") break;
    p = dataStart + len + 4;   // data + 4-byte CRC
  }
  return null;
}

/* JPEG recipe transport — the same "muse\0<json>" payload in a COM (0xFFFE) segment
   (§6, no EXIF lib). The COM is spliced in right after SOI; readers walk the marker
   list. Recipe JSON is ASCII, so Latin-1 bytes round-trip exactly, as with PNG tEXt. */
function embedRecipeJPEG(jpeg, recipeStr) {
  if (jpeg.length < 2 || jpeg[0] !== 0xff || jpeg[1] !== 0xd8) return jpeg;   // not a JPEG — leave as-is
  const payload = latin1Bytes(RECIPE_KEYWORD + "\0" + recipeStr);
  const segLen = payload.length + 2;                    // COM length field counts its own 2 bytes
  if (segLen > 0xffff) return jpeg;                      // COM caps at ~65533 B; recipes are tiny
  const seg = new Uint8Array(4 + payload.length);
  seg[0] = 0xff; seg[1] = 0xfe; seg[2] = (segLen >> 8) & 0xff; seg[3] = segLen & 0xff;
  seg.set(payload, 4);
  // Insert AFTER the first APPn segment when present (JFIF wants APP0 right after SOI),
  // else right after SOI. Canvas-encoded JPEGs always start SOI · APP0.
  let at = 2;
  if (jpeg[2] === 0xff && jpeg[3] >= 0xe0 && jpeg[3] <= 0xef) {
    const alen = (jpeg[4] << 8) | jpeg[5];
    if (alen >= 2 && 4 + alen <= jpeg.length) at = 4 + alen;
  }
  const out = new Uint8Array(jpeg.length + seg.length);
  out.set(jpeg.subarray(0, at), 0);
  out.set(seg, at);                                     // COM after APP0 (or after SOI as a fallback)
  out.set(jpeg.subarray(at), at + seg.length);
  return out;
}
function readRecipeJPEG(jpeg) {
  if (jpeg.length < 2 || jpeg[0] !== 0xff || jpeg[1] !== 0xd8) return null;
  let p = 2;
  while (p + 4 <= jpeg.length) {
    if (jpeg[p] !== 0xff) { p++; continue; }             // resync to the next marker
    const marker = jpeg[p + 1];
    if (marker === 0xff) { p++; continue; }              // 0xFF fill byte before a real marker
    if (marker === 0xd9 || marker === 0xda) break;       // EOI, or SOS → entropy data follows
    if (marker === 0x00 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) { p += 2; continue; }   // standalone / stuffed (no length)
    const len = (jpeg[p + 2] << 8) | jpeg[p + 3];        // segment length incl. these 2 bytes
    if (len < 2) break;
    if (marker === 0xfe) {                               // COM
      const data = jpeg.subarray(p + 4, p + 2 + len);
      const z = data.indexOf(0);
      if (z >= 0 && latin1Str(data.subarray(0, z)) === RECIPE_KEYWORD) return latin1Str(data.subarray(z + 1));
    }
    p += 2 + len;
  }
  return null;
}

/* =========================================================================
 * v2.0 — Reference-Match (BYOK vision). The subject photo NEVER leaves the
 * device; only the user-chosen REFERENCE is sent, opt-in, to the user's own
 * vision-LLM key. The model reads the reference's film-look and proposes an
 * editable recipe; nothing is auto-applied. visionMatch() is the single
 * network seam — the m3 self-test mocks it, so the flow is key-free testable.
 * ========================================================================= */

// Build the recipe-schema description from the live PANEL so the prompt can
// never drift from the actual params/ranges.
function recipeSchemaText() {
  return PANEL.map((g) => {
    const parts = g.controls.map((c) => {
      if (c.kind === "select") return `${c.prop} (one of ${c.options.map((o) => `"${o}"`).join("/")})`;
      if (c.kind === "toggle") return `${c.prop}(bool)`;
      const rng = `${c.min}..${c.max}`;
      return c.rgb ? `${c.prop}[r,g,b] each ${rng}` : `${c.prop} ${rng}`;
    });
    return `- ${g.pass}: bypass(bool), ${parts.join(", ")}`;
  }).join("\n");
}

function referencePrompt() {
  return `You are a film-look colorist analysing a REFERENCE photo for the Muse photo tool. Muse renders a look as a JSON "recipe" over a fixed 8-pass shader chain. Read the reference's photographic LOOK — colour cast/temperature, contrast and tonal curve, saturation, film grain (amount + size), vignette/flash falloff, halation/bloom around highlights, soft-focus/defocus, chromatic aberration, and any duotone/split-tone — and return ONLY a JSON recipe that makes an ordinary photo resemble this reference's look (not its content).

Recipe shape: {"look":"custom","seed":1,"params":{<pass>:{...}}}. Passes + params (stay within ranges; omit a pass to leave it at default/identity):
${recipeSchemaText()}

Notes:
- curve is ASC-CDL: slope(gain), offset(lift), power(gamma) are per-channel [r,g,b]; sat 0..2 (1=unchanged); temp -1..1 (warm/cool); contrast -1..1; tone is duotone {lo:[r,g,b],hi:[r,g,b],amt 0..1}, amt>0 ONLY for toned monochrome.
- grain.amount ~0.03 subtle … 0.15 heavy; flash.vignette darkens edges; halation.strength blooms highlights.
- Set a pass's "bypass":false whenever you use it. Keep values realistic — subtle film emulation, not a heavy filter.
Return ONLY the JSON object — no prose, no markdown fence.`;
}

// Provider adapters. Each builds the request + extracts the model's raw text.
const PROVIDERS = {
  anthropic: {
    label: "Anthropic (Claude)", model: "claude-sonnet-5",
    endpoint: "https://api.anthropic.com/v1/messages",
    build(imgDataURI, prompt, key, model) {
      const [meta, b64] = imgDataURI.split(",");
      const mediaType = (meta.match(/data:(image\/[\w+.-]+)/) || [])[1] || "image/jpeg";
      return {
        headers: { "content-type": "application/json", "x-api-key": key,
          "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: model || this.model, max_tokens: 1024,
          messages: [{ role: "user", content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: b64 } },
            { type: "text", text: prompt } ] }] }),
      };
    },
    text(json) { return (json.content || []).map((c) => c.text || "").join(""); },
  },
  openai: {
    label: "OpenAI (GPT-4o)", model: "gpt-4o",
    endpoint: "https://api.openai.com/v1/chat/completions",
    build(imgDataURI, prompt, key, model) {
      return {
        headers: { "content-type": "application/json", "authorization": "Bearer " + key },
        body: JSON.stringify({ model: model || this.model, max_tokens: 1024,
          response_format: { type: "json_object" },
          messages: [{ role: "user", content: [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: imgDataURI } } ] }] }),
      };
    },
    text(json) { const ch = (json.choices || [])[0]; return (ch && ch.message && ch.message.content) || ""; },
  },
};

// Pull the first JSON object out of model text (tolerate a ```json fence or stray prose).
function parseRecipeText(text) {
  if (!text) return null;
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) s = fence[1].trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (_) { return null; }
}

// Clamp a proposed recipe to the PANEL bounds — deserialiseRecipe fills/normalises shape
// but does NOT range-check, and a model won't always obey the range hints in the prompt.
function clampRecipe(rec) {
  const num = (v, lo, hi) => Math.min(hi, Math.max(lo, Number.isFinite(+v) ? +v : lo));
  for (const g of PANEL) {
    const p = rec.params[g.pass]; if (!p) continue;
    if (typeof p.bypass !== "boolean") p.bypass = false;
    for (const c of g.controls) {
      const dot = c.prop.indexOf(".");
      const container = dot < 0 ? p : p[c.prop.slice(0, dot)];
      const key = dot < 0 ? c.prop : c.prop.slice(dot + 1);
      if (!container || container[key] == null) continue;
      if (c.kind === "select") { if (!c.options.includes(container[key])) container[key] = c.options[0]; }
      else if (c.kind === "toggle") container[key] = !!container[key];
      else if (c.rgb) { const a = container[key]; if (Array.isArray(a)) for (let i = 0; i < 3; i++) a[i] = num(a[i], c.min, c.max); }
      else container[key] = num(container[key], c.min, c.max);
    }
  }
  rec.seed = (Math.max(0, Math.floor(Number(rec.seed) || 1))) >>> 0;
  return rec;
}

// The single network seam (mock in m3-selftest). Returns a validated/clamped recipe
// object or throws with a code the UI maps to an in-app message.
async function visionMatch(imgDataURI, cfg) {
  const prov = PROVIDERS[cfg && cfg.provider]; if (!prov) throw new Error("provider");
  if (!cfg.key) throw new Error("no-key");
  const req = prov.build(imgDataURI, referencePrompt(), cfg.key, cfg.model);
  const r = await fetch(prov.endpoint, { method: "POST", headers: req.headers, body: req.body });
  if (!r.ok) { const t = await r.text().catch(() => ""); throw new Error("http-" + r.status + (t ? ": " + t.slice(0, 160) : "")); }
  const obj = parseRecipeText(prov.text(await r.json()));
  if (!obj || !obj.params) throw new Error("bad-json");
  const rec = clampRecipe(deserialiseRecipe(obj)); rec.via = "reference"; rec.provider = cfg.provider;
  return rec;
}

// Save a blob via the File System Access API, falling back to <a download>.
async function saveBlob(blob, name) {
  if (window.showSaveFilePicker) {
    try {
      const ext = "." + (name.split(".").pop() || "png");
      const h = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "Image", accept: { [blob.type || "image/png"]: [ext] } }],
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      return "saved";
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      // fall through to download on any FSA failure
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return "downloaded";
}

/* Focus-trap Tab within a container (drawer/modal share this shape). */
function trapTab(e, container) {
  const f = container.querySelectorAll("button, [href], input, select, [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
